<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS POP! — Arduino Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="shortcut icon" href="./image.jpg" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1650;--pink:#ff5fa2;--blue:#4da6ff;--yel:#ffd93d;--grn:#5be37d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;color:#fff;overflow:hidden;user-select:none;display:grid;place-items:center;background:linear-gradient(160deg,#5b3df5,#a04dff 45%,#ff6fb5)}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 40px,transparent 40px 80px);animation:slide 6s linear infinite}
@keyframes slide{to{background-position:113px 0}}
.hide{display:none!important}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;perspective:800px;pointer-events:none}
.scene-sky{position:absolute;inset:0;opacity:0;transition:opacity .85s cubic-bezier(.2,.7,.2,1);will-change:opacity}
.scene-sky.active{opacity:1}
.scene-landscape{position:absolute;inset:0;overflow:hidden;opacity:.34;transition:opacity .7s}
.scene-landscape::before,.scene-landscape::after{content:'';position:absolute;left:-10%;right:-10%;bottom:-22%;height:43%;border-radius:50% 50% 0 0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(17,89,101,.15))}
.scene-landscape::after{left:28%;bottom:-30%;height:53%;background:linear-gradient(160deg,rgba(239,255,232,.4),rgba(37,111,113,.12))}
.ambient-particles{position:absolute;inset:0;perspective:800px}
.fb,.ambient-particle{position:absolute;bottom:-120px;border:4px solid var(--ink);border-radius:28%;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),inset 6px 6px 0 rgba(255,255,255,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotateX(360deg) rotateY(300deg) rotateZ(200deg)}}
.ambient-particle.leaf{top:-60px;bottom:auto;border:0;border-radius:4px 85% 4px 85%;background:linear-gradient(145deg,#d9f6ad,#62b98d);box-shadow:inset 3px 2px 4px rgba(255,255,255,.55),0 5px 12px rgba(16,87,74,.15);animation:leafFall linear infinite}
@keyframes leafFall{0%{transform:translate3d(0,-12vh,0) rotate(var(--leaf-rotation,0deg))}35%{transform:translate3d(var(--leaf-drift,34px),30vh,0) rotate(calc(var(--leaf-rotation,0deg) + 110deg))}68%{transform:translate3d(var(--leaf-drift-back,-26px),68vh,0) rotate(calc(var(--leaf-rotation,0deg) + 250deg))}100%{transform:translate3d(var(--leaf-drift-end,15px),125vh,0) rotate(calc(var(--leaf-rotation,0deg) + 440deg))}}
.ambient-particle.mote{bottom:-12px;width:7px;height:7px;border:0;border-radius:50%;background:#eaffeb;box-shadow:0 0 14px rgba(255,255,255,.8);animation:moteFloat linear infinite}
@keyframes moteFloat{0%{transform:translate3d(0,0,0);opacity:0}20%{opacity:.55}80%{opacity:.45}100%{transform:translate3d(24px,-115vh,0);opacity:0}}
.ambient-particle.spark{width:5px;height:18px;border:0;border-radius:99px;background:linear-gradient(#ffbd6d,#ff394c);box-shadow:0 0 15px #ff5b46;animation:sparkRise linear infinite}
@keyframes sparkRise{to{transform:translate3d(45px,-120vh,0) rotate(55deg);opacity:0}}
.ambient-particle.streak{width:3px;height:72px;border:0;border-radius:99px;background:linear-gradient(transparent,#a4eaff);box-shadow:0 0 15px #6ddcff;animation:streakPass linear infinite}
@keyframes streakPass{to{transform:translate3d(-65px,120vh,0) rotate(15deg);opacity:0}}
.ambient-particle.star{width:9px;height:9px;border:2px solid rgba(255,255,255,.8);border-radius:35%;background:#ffe895;box-shadow:0 0 18px rgba(255,222,127,.8);animation:starDrift linear infinite}
@keyframes starDrift{50%{transform:translate3d(12px,-38vh,0) rotate(160deg);opacity:.8}100%{transform:translate3d(-8px,-90vh,0) rotate(320deg);opacity:0}}
section{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
/* botões */
.btn{font:inherit;font-weight:700;font-size:22px;color:#fff;padding:.6em 1.4em;border:5px solid var(--ink);border-radius:20px;background:var(--b,#4da6ff);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 8px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.15),inset 0 6px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .15s,filter .15s}
.btn.green{--b:#2fcf6a}.btn.red{--b:#ff5252}.btn.blue{--b:#4da6ff}
.btn.sel,.btn:hover{transform:translateY(-4px) scale(1.1) rotate(-1.5deg);filter:brightness(1.1)}
.btn.sel::before{content:'▶ '}
.btn.press,.btn:active{transform:translateY(7px) scale(1.02);box-shadow:0 1px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.15)}
.k{display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 8px;border-radius:12px;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);margin:0 4px;font-weight:700}
/* menu */
#menu{gap:2.4vh}
.logo{display:flex;gap:.5vw;font-size:min(14vw,128px);line-height:1;transform:perspective(700px) rotateX(16deg)}
.logo span{color:var(--c);-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;animation:bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.13s);text-shadow:0 .04em 0 var(--ink),0 .08em 0 var(--ink),0 .12em 0 var(--ink),0 .16em 0 var(--ink),0 .2em 0 #1a0b33,0 .34em .2em rgba(0,0,0,.35)}
@keyframes bob{50%{transform:translateY(-.1em) rotate(var(--r,3deg))}}
.sub{background:var(--yel);color:var(--ink);padding:.3em 1.1em;border-radius:99px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);font-size:min(3vw,22px)}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{padding:.3em 1em;border-radius:99px;border:4px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);font-size:16px;transition:.3s}
.pill.ok{background:var(--grn);animation:pp .5s}
#cards{position:relative;height:min(44vh,370px);width:min(94vw,900px);perspective:1100px;margin:1vh 0 3vh}
.card{--w:min(30vw,250px);--led:#fff;position:absolute;left:50%;top:0;width:var(--w);margin-left:calc(var(--w)/-2);height:100%;overflow:hidden;border:5px solid var(--led);border-radius:32px;background:linear-gradient(155deg,rgba(255,255,255,.28),transparent 30%),var(--cc);box-shadow:0 12px 0 var(--ink),0 0 0 2px var(--ink),0 0 26px color-mix(in srgb,var(--led) 45%,transparent),inset 0 -14px 0 rgba(0,0,0,.16),inset 0 10px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;text-align:center;cursor:pointer;text-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .35s,filter .3s,box-shadow .3s,border-color .3s;backface-visibility:hidden}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.32) 48%,transparent 68%);transform:translateX(-130%);transition:transform .7s ease}
.card:hover::before,.card.sel::before{transform:translateX(130%)}
.card-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;width:100%;height:100%;transition:transform .22s ease-out;transform:perspective(700px) rotateX(var(--hover-x,0deg)) rotateY(var(--hover-y,0deg)) translateZ(12px)}
.card .ic{font-size:min(10vh,84px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:bob 2s ease-in-out infinite}
.card .ic img{width:min(16vh,130px);height:min(16vh,130px);object-fit:contain;display:block}
.card h2{font-size:min(4.2vh,32px)}
.card p{font-size:min(2.3vh,17px);padding:0 14px;opacity:.95}
.card.sel{filter:brightness(1.1);border-color:var(--led);outline:2px solid rgba(255,255,255,.6);animation:cardArrive .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardArrive{0%{filter:brightness(.7)}55%{filter:brightness(1.28)}100%{filter:brightness(1.1)}}
.card.confirming{animation:cardConfirm .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardConfirm{40%{filter:brightness(1.55)}100%{filter:brightness(1.1)}}
.card.sel::after{content:'▼ APERTE BAIXO';position:absolute;bottom:-58px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:99px;padding:.15em .9em;font-size:16px;text-shadow:none;box-shadow:0 4px 0 var(--ink);animation:hint .8s ease-in-out infinite alternate}
@keyframes hint{to{transform:translateY(8px)}}
.card.press{transform:translateY(14px) scale(1)!important}
.keys{display:flex;gap:6px;align-items:center;margin-top:2vh;font-size:18px;flex-wrap:wrap;justify-content:center}
body[data-scene="zen"]{color:#f5fff8;background:#91d9d4}
body[data-scene="zen"]::before{opacity:.2;background:radial-gradient(ellipse at 16% 18%,rgba(255,255,255,.34),transparent 38%),radial-gradient(ellipse at 82% 28%,rgba(197,255,226,.34),transparent 40%),linear-gradient(120deg,rgba(49,177,191,.12),transparent 52%,rgba(109,196,147,.14));animation:zenWind 28s ease-in-out infinite alternate}
@keyframes zenWind{to{background-position:30px 0,-24px 12px,0 0}}
body[data-scene="zen"] #bg .scene-landscape{opacity:.48;filter:blur(1px)}
body[data-scene="zen"] #bg .scene-landscape::before{background:linear-gradient(160deg,rgba(226,255,238,.36),rgba(66,169,157,.18))}
body[data-scene="zen"] #bg .scene-landscape::after{background:linear-gradient(160deg,rgba(238,255,218,.42),rgba(48,142,146,.16))}
body[data-scene="zen"] .card{--ink:#355f60;--led:#d7fff1;background:linear-gradient(150deg,rgba(245,255,250,.8),rgba(163,224,210,.48));color:#24565a;text-shadow:none;box-shadow:0 12px 0 rgba(30,83,81,.45),0 0 24px rgba(209,255,237,.45),inset 0 0 24px rgba(255,255,255,.5)}
body[data-scene="zen"] .card p{color:#326c6a}
body[data-scene="zen"] .card.sel{box-shadow:0 12px 0 rgba(30,83,81,.38),0 0 40px rgba(222,255,241,.8),inset 0 0 30px rgba(255,255,255,.68)}
body[data-scene="classic"] .card{--led:#8cecff}
body[data-scene="classic"] .card.sel{box-shadow:0 12px 0 var(--ink),0 0 0 3px #8cecff,0 0 46px #28c6ff,inset 0 -14px 0 rgba(0,0,0,.16),inset 0 10px 0 rgba(255,255,255,.38)}
body[data-scene="hardcore"]{color:#fff3ea}
body[data-scene="hardcore"]::before{opacity:.3;background:repeating-linear-gradient(165deg,transparent 0 72px,rgba(255,74,45,.11) 74px 76px,transparent 78px 150px)}
body[data-scene="hardcore"] .card{--ink:#160f22;--led:#ff6848;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 45%),linear-gradient(150deg,#421d2b,#211927 68%,#5b2225);box-shadow:0 14px 0 #120d19,0 0 28px rgba(255,59,46,.3),inset 0 -14px 0 rgba(0,0,0,.32),inset 0 4px 0 rgba(255,198,150,.22)}
body[data-scene="hardcore"] .card.sel{box-shadow:0 14px 0 #120d19,0 0 0 3px #ff8b4e,0 0 50px #ff442d,inset 0 -14px 0 rgba(0,0,0,.32),inset 0 4px 0 rgba(255,198,150,.22)}
body[data-scene="survival"] .card{--led:#54f0d7;background:linear-gradient(145deg,rgba(255,255,255,.18),transparent 45%),linear-gradient(150deg,#145b68,#12364a 70%,#1b7b76)}
body[data-scene="timeAttack"] .card{--led:#ffd45e;background:linear-gradient(120deg,rgba(255,255,255,.3),transparent 44%),linear-gradient(150deg,#165c9a,#217dc4 70%,#ed9137)}
body[data-scene="challenge"] .card{--led:#fff099;background:linear-gradient(145deg,rgba(255,255,255,.3),transparent 45%),linear-gradient(145deg,#8b59c4,#5543a3 66%,#d87eb7)}
.card[data-scene="zen"]{--led:#d7fff1;background:linear-gradient(155deg,rgba(248,255,250,.8),rgba(145,222,206,.65));color:#24565a;text-shadow:none;backdrop-filter:blur(8px)}
.card[data-scene="classic"]{--led:#5be5ff;background:linear-gradient(145deg,rgba(255,255,255,.26),transparent 34%),linear-gradient(150deg,#3720ba,#6028b8 70%,#db399f)}
.card[data-scene="hardcore"]{--led:#ff6848;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 45%),linear-gradient(150deg,#421d2b,#211927 68%,#5b2225)}
.card[data-scene="survival"]{--led:#54f0d7;background:linear-gradient(145deg,rgba(255,255,255,.18),transparent 45%),linear-gradient(150deg,#145b68,#12364a 70%,#1b7b76)}
.card[data-scene="timeAttack"]{--led:#ffd45e;background:linear-gradient(120deg,rgba(255,255,255,.3),transparent 44%),linear-gradient(150deg,#165c9a,#217dc4 70%,#ed9137)}
.card[data-scene="challenge"]{--led:#fff099;background:linear-gradient(145deg,rgba(255,255,255,.3),transparent 45%),linear-gradient(145deg,#8b59c4,#5543a3 66%,#d87eb7)}
body .card[data-scene="zen"]{--ink:#355f60;--led:#d7fff1;background:linear-gradient(155deg,rgba(248,255,250,.8),rgba(145,222,206,.65));color:#24565a;text-shadow:none;backdrop-filter:blur(8px)}
body .card[data-scene="classic"]{--ink:#2b1650;--led:#5be5ff;background:linear-gradient(145deg,rgba(255,255,255,.26),transparent 34%),linear-gradient(150deg,#3720ba,#6028b8 70%,#db399f)}
body .card[data-scene="hardcore"]{--ink:#160f22;--led:#ff6848;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 45%),linear-gradient(150deg,#421d2b,#211927 68%,#5b2225)}
body .card[data-scene="survival"]{--ink:#102e36;--led:#54f0d7;background:linear-gradient(145deg,rgba(255,255,255,.18),transparent 45%),linear-gradient(150deg,#145b68,#12364a 70%,#1b7b76)}
body .card[data-scene="timeAttack"]{--ink:#09234c;--led:#ffd45e;background:linear-gradient(120deg,rgba(255,255,255,.3),transparent 44%),linear-gradient(150deg,#165c9a,#217dc4 70%,#ed9137)}
body .card[data-scene="challenge"]{--ink:#31214f;--led:#fff099;background:linear-gradient(145deg,rgba(255,255,255,.3),transparent 45%),linear-gradient(145deg,#8b59c4,#5543a3 66%,#d87eb7)}
body[data-scene="survival"]::before{opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 46px,rgba(66,247,218,.08) 47px 48px)}
body[data-scene="timeAttack"]::before{opacity:.2;background:repeating-linear-gradient(105deg,transparent 0 80px,rgba(255,238,172,.15) 81px 83px,transparent 84px 150px)}
body[data-scene="challenge"]::before{opacity:.24;background:radial-gradient(circle at 20% 20%,rgba(255,245,177,.2) 0 2px,transparent 3px),radial-gradient(circle at 70% 65%,rgba(255,245,177,.18) 0 2px,transparent 3px);background-size:95px 95px,135px 135px}
body[data-scene="zen"] .ambient-particle{filter:saturate(.9)}
body[data-scene="zen"] #game .bw canvas.main{border-color:#66a99e;border-radius:26px;box-shadow:0 12px 28px rgba(28,92,91,.24),0 0 0 5px rgba(224,255,239,.9),0 0 32px rgba(114,220,203,.3)}
body[data-scene="zen"] #game .skill-side,body[data-scene="zen"] #game .nx,body[data-scene="zen"] #game .missionCard{border-color:#79aaa0;box-shadow:0 6px 16px rgba(35,107,94,.12)}
body[data-scene="zen"] #game .tag,body[data-scene="zen"] #game .chips b,body[data-scene="zen"] #game .nx{background:rgba(246,255,252,.9);color:#24565a;border-color:#78aaa0;box-shadow:0 5px 0 rgba(50,119,108,.34)}
body[data-scene="zen"] #game .chips i,body[data-scene="zen"] #game .nx i{color:#218d89}
body[data-scene="zen"] #game .soloExtras{display:none!important}
body[data-scene="zen"] #game .game-hud{gap:9px}
body[data-scene="zen"] #game .hud-pill{background:rgba(245,255,251,.9);color:#24565a;border-color:#78aaa0;box-shadow:0 4px 0 rgba(50,119,108,.34)}
body[data-scene="zen"] #game .comboBadge{background:#dff7d9;color:#24565a;border-color:#78aa88;box-shadow:0 4px 12px rgba(39,112,89,.2);animation:zenGlow 2.8s ease-in-out infinite alternate}
.zen-game-control{display:none;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:5px 12px;border:3px solid #78aaa0;border-radius:16px;background:rgba(246,255,252,.94);color:#24565a;box-shadow:0 4px 0 rgba(50,119,108,.34);font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;transition:transform .15s,filter .15s}
.zen-game-control:hover{transform:translateY(-2px);filter:brightness(1.04)}
.zen-game-control:focus-visible{outline:3px solid #28a99f;outline-offset:3px}
.zen-ability-ring{position:relative;display:grid;place-items:center;width:34px;height:34px;flex:none}
.zen-ability-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.zen-ability-ring circle{fill:none;stroke-width:3}
.zen-ability-ring .track{stroke:rgba(55,143,133,.18)}
.zen-ability-ring .progress{stroke:#32b8ac;stroke-linecap:round;stroke-dasharray:100.5;stroke-dashoffset:0;transition:stroke-dashoffset .2s linear}
.zen-ability-status{position:relative;font-size:9px;line-height:1;text-align:center}
.zen-ability-copy{display:grid;gap:2px;text-align:left;white-space:nowrap;font-size:12px}
.zen-ability-copy small{font-size:9px;opacity:.72}
.zen-ability-button{min-width:132px}
.zen-ability-button[aria-disabled="true"]{opacity:.64;cursor:default}
.zen-ability-button[aria-disabled="true"]:hover{transform:none}
.zen-pause-button{width:44px;padding:4px;font-size:20px}
@keyframes zenGlow{to{filter:brightness(1.05);transform:translateX(-50%) translateY(-3px)}}
body[data-scene="classic"] #game .bw canvas.main{box-shadow:0 10px 0 #120a34,0 0 0 6px #57d8ff,0 0 32px rgba(52,192,255,.56)}
body[data-scene="classic"] #game .comboBadge{box-shadow:0 0 24px #ffd93d,0 5px 0 var(--ink)}
body[data-scene="hardcore"] #game .tag,body[data-scene="hardcore"] #game .chips b,body[data-scene="hardcore"] #game .nx,body[data-scene="hardcore"] #game .missionCard,body[data-scene="hardcore"] #game .skill-side{background:linear-gradient(150deg,#352934,#1b1723);color:#ffe8de;border-color:#85483c;box-shadow:0 6px 0 #100d15,0 0 18px rgba(255,70,42,.16)}
body[data-scene="hardcore"] #game .bw canvas.main{border-color:#7b413a;box-shadow:0 10px 0 #100d15,0 0 0 6px #fa583e,0 0 36px rgba(255,61,41,.48)}
body[data-scene="hardcore"] #game .chips i,body[data-scene="hardcore"] #game .nx i{color:#ff8964}
body[data-scene="hardcore"] #game .comboBadge{background:#ff683f;color:#fff4e8;animation:hardcorePulse .8s ease-in-out infinite alternate}
@keyframes hardcorePulse{to{filter:brightness(1.22);box-shadow:0 0 28px rgba(255,66,36,.72),0 4px 0 #160f22}}
body[data-scene="survival"] #game .bw canvas.main{border-color:#36cbb6;box-shadow:0 10px 0 #071b2b,0 0 0 6px rgba(62,228,203,.8),0 0 28px rgba(39,234,203,.32)}
body[data-scene="survival"] #game .tag,body[data-scene="survival"] #game .chips b,body[data-scene="survival"] #game .nx,body[data-scene="survival"] #game .missionCard{border-color:#45bcae}
body[data-scene="timeAttack"] #game #timer{border-color:#ffd45e;box-shadow:0 6px 0 #09234c,0 0 24px rgba(101,199,255,.55)}

body[data-scene="challenge"] #game .bw canvas.main{border-color:#d6b7ff;box-shadow:0 10px 0 #21143b,0 0 0 6px #ffe58d,0 0 30px rgba(255,231,141,.32)}
body[data-scene="challenge"] #game .missionCard,body[data-scene="challenge"] #game .skill-side{border-color:#d5b9ff;box-shadow:0 6px 0 #291b46,0 0 18px rgba(255,226,137,.18)}
body[data-scene="hardcore"] #game .bw canvas.main{box-shadow:0 10px 0 #100d15,0 0 0 5px #fa583e,0 0 36px rgba(255,61,41,var(--mode-intensity,.5))}
body[data-scene="survival"] #game .bw canvas.main{box-shadow:0 10px 0 #071b2b,0 0 0 6px rgba(62,228,203,.8),0 0 30px rgba(39,234,203,var(--mode-intensity,.3))}
body[data-scene="zen"] .card.sel{animation:none}
/* jogo */
#game{gap:1vh}
#timer{position:relative;font-size:34px;background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:20px;padding:0 .8em;box-shadow:0 6px 0 var(--ink)}
#timer.u{background:#ff5252;color:#fff;animation:shk .3s infinite}
#timer.timer-bonus::after{content:attr(data-bonus);position:absolute;left:50%;top:-.95em;z-index:2;white-space:nowrap;color:#fff;font-size:22px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;animation:timerBonus 1s ease-out forwards}
@keyframes timerBonus{0%{opacity:0;transform:translate(-50%,12px) scale(.7)}25%{opacity:1;transform:translate(-50%,-4px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-38px) scale(1)}}
#arena{display:flex;gap:min(3vw,36px);align-items:flex-start;justify-content:center}
.game-hud{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.hud-pill{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 12px;box-shadow:0 4px 0 var(--ink);font-size:14px}
.energy-meter{width:min(220px,40vw);height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.energy-meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,#4da6ff,#5be37d,#ffd93d);transition:width .25s ease}
.skill-side{display:none;flex-direction:column;align-items:stretch;gap:7px;width:clamp(112px,14vw,154px);flex:none;padding:8px;background:linear-gradient(155deg,#fff,#f4eaff);color:var(--ink);border:5px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink),0 0 0 4px var(--pc)}
#arena.one .skill-side{display:flex}
.skill-side h3{font-size:14px;text-align:center;line-height:1.05}
.skill-energy{padding:7px;background:#fff;border:3px solid var(--ink);border-radius:13px;box-shadow:0 3px 0 var(--ink);text-align:center}
.skill-energy strong{display:block;font-size:12px}
.skill-energy .energy-meter{width:100%;height:13px;margin-top:5px}
.skill-menu-trigger,.skill-activate{min-height:42px;padding:5px 7px;border:3px solid var(--ink);border-radius:12px;background:#c792ff;color:var(--ink);box-shadow:0 4px 0 var(--ink);font:inherit;font-size:11px;font-weight:700;cursor:pointer;touch-action:manipulation;transition:transform .15s,filter .15s}
.skill-activate{background:#5be37d}
.skill-menu-trigger:hover,.skill-activate:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.05)}
.skill-activate:disabled{opacity:.52;filter:grayscale(.7);cursor:not-allowed}
.selected-skill{min-height:42px;padding:5px;background:#fff;border:2px dashed #9d64d5;border-radius:11px;text-align:center;font-size:10px;line-height:1.2}
.selected-skill b{display:block;font-size:11px}
.skill-side .holdCard{margin-top:auto}
.skill-modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:rgba(35,12,76,.72);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.skill-modal.open{opacity:1;visibility:visible}
.skill-dialog{width:min(760px,94vw);max-height:min(86vh,760px);overflow:auto;padding:20px;background:linear-gradient(145deg,#fff,#f5e9ff);color:var(--ink);border:6px solid var(--ink);border-radius:26px;box-shadow:0 12px 0 var(--ink);transform:translateY(18px) scale(.96);transition:transform .25s cubic-bezier(.2,1.3,.4,1)}
.skill-modal.open .skill-dialog{transform:translateY(0) scale(1)}
.skill-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.skill-dialog-head h2{font-size:clamp(20px,4vw,30px)}
.skill-dialog-head p{font-size:13px}
.skill-close{width:40px;height:40px;border:3px solid var(--ink);border-radius:50%;background:#ff8a8a;color:var(--ink);font:inherit;font-size:23px;font-weight:700;cursor:pointer}
.ability-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ability-button{position:relative;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;min-height:60px;padding:7px;border:3px solid var(--ink);border-radius:14px;background:#f3eaff;color:var(--ink);text-align:left;font:inherit;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .15s,background .15s,opacity .15s}
.ability-button:hover{transform:translateY(-2px)}
.ability-button.selected{background:#d9ffdf;outline:3px solid #35b35d}
.ability-button.unavailable{opacity:.68}
.ability-button .ability-icon{font-size:26px;text-align:center}
.ability-button strong{display:block;font-size:13px}
.ability-button small{display:block;font-size:10px;line-height:1.2;font-weight:500}
.ability-button .ability-state{font-size:10px;font-weight:700;text-align:right}
.ability-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:3px dashed #cbb4e8;font-size:12px}
.ability-feedback{display:block;min-height:34px;padding:8px 10px;border-radius:10px;background:#eee7fa;color:var(--ink);font-weight:600;line-height:1.35}
.ability-footer .skill-activate{min-width:170px;font-size:14px}
.skill-hint{margin-top:8px;font-size:11px;opacity:.75;text-align:right}
.result-outcome{font-size:23px;margin:6px 0}
#game.lightning-active::before{content:'';position:fixed;inset:0;z-index:8;pointer-events:none;box-shadow:inset 0 0 130px 35px rgba(13,25,83,.62);animation:stormPulse .8s ease-in-out infinite alternate}
#game.lightning-active .pl{position:relative;filter:drop-shadow(0 0 12px #9ff5ff)}
#game.lightning-active .pl::after{content:'⚡';position:absolute;right:-12px;top:20%;z-index:7;color:#e5fbff;font-size:42px;text-shadow:0 0 10px #43cbff;pointer-events:none;animation:spark .28s steps(2,end) infinite alternate}
@keyframes stormPulse{to{box-shadow:inset 0 0 175px 50px rgba(13,25,83,.78)}}
@keyframes spark{to{opacity:.35;transform:rotate(18deg) scale(.8)}}
#vs{align-self:center;font-size:54px;color:var(--yel);-webkit-text-stroke:.1em var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);animation:bob 1s infinite}
.pl{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{translate:0 -8px}}
.tag{display:inline-block;background:var(--pc);border:4px solid var(--ink);border-radius:14px;padding:0 20px;font-size:22px;box-shadow:0 5px 0 var(--ink);margin-bottom:10px;transform:rotate(-3deg)}
.tilt{transform:perspective(1100px) rotateY(var(--ry)) rotateX(5deg)}
#arena.one .pl{--ry:0deg!important}
.sk{animation:shk .25s}
@keyframes shk{25%{translate:-6px 4px}75%{translate:6px -3px}}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips b{flex:1;font-size:11px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:3px 8px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.chips i,.nx i{display:block;font-style:normal;font-size:20px;color:var(--pc)}
.bw{position:relative;display:flex;align-items:flex-start}
.bw canvas.main{height:min(62vh,560px);width:auto;border:6px solid var(--ink);border-radius:20px;background:var(--board,#2a1a5e);box-shadow:0 10px 0 var(--ink),0 0 0 6px var(--pc),0 0 40px var(--pc)}
.bw canvas.main{transition:transform .45s cubic-bezier(.2,1.4,.4,1),filter .3s}
.bw.emp-active canvas.main{transform:rotate(180deg);filter:drop-shadow(0 0 12px #65e8ff)}
.bw.curse-active canvas.main{filter:drop-shadow(0 0 12px #bd78ff)}
.bw.curse-active::after{content:'☠';position:absolute;inset:0 114px 0 0;display:grid;place-items:center;border:4px solid rgba(192,119,255,.7);border-radius:18px;background:radial-gradient(ellipse,rgba(115,43,165,.13),rgba(67,21,116,.42));color:rgba(235,201,255,.72);font-size:clamp(38px,7vw,72px);text-shadow:0 0 18px #bd78ff;pointer-events:none;animation:curseAura 1.2s ease-in-out infinite alternate}
.bw.trash-active canvas.main{filter:drop-shadow(0 0 12px #9ca3af)}
.bw.trash-active::before{content:'';position:absolute;inset:0 114px 0 0;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.42) 0 20%,transparent 20% 80%,rgba(0,0,0,.42) 80% 100%);pointer-events:none}
.bw.trash-active::after{content:'🗑️';position:absolute;inset:0 114px 0 0;z-index:3;display:grid;place-items:center;color:rgba(255,255,255,.2);font-size:clamp(36px,6vw,64px);pointer-events:none}
@keyframes curseAura{to{box-shadow:inset 0 0 32px rgba(191,120,255,.62),0 0 24px rgba(191,120,255,.55)}}
.bw.emp-active::after{content:'';position:absolute;inset:0 114px 0 0;border:4px solid rgba(90,229,255,.7);border-radius:18px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(95,235,255,.13) 10px 12px);animation:empGlitch .17s steps(2,end) infinite alternate}
@keyframes empGlitch{to{filter:hue-rotate(35deg);opacity:.55}}
.sd{display:flex;flex-direction:column;gap:10px;margin-left:16px;width:108px}
.nx{display:flex;flex-direction:column;gap:4px;align-items:center;background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:18px;padding:8px;box-shadow:0 6px 0 var(--ink);font-size:12px}
.nx canvas{width:72px;height:72px}
#arena.one .pw{display:none}
.soloExtras{display:none;flex-direction:column;gap:9px}
#arena.one .soloExtras{display:flex}
.missionCard,.holdCard{width:100%;background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:16px;padding:7px 5px;text-align:center;box-shadow:0 5px 0 var(--ink);font-size:11px}
.missionCard b,.holdCard b{display:block;font-size:11px}
.missionCard span{display:block;margin-top:3px;line-height:1.15}
.missionCard i{display:block;font-style:normal;font-size:15px;color:var(--pc);margin-top:3px}
.holdCard{display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;cursor:pointer}
.holdCard canvas{width:58px;height:58px}
.holdCard small{font-size:9px;opacity:.75}
.soloPower{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border:4px solid var(--ink);border-radius:14px;background:#ffe66d;color:var(--ink);box-shadow:0 5px 0 var(--ink);font:inherit;font-weight:700;font-size:11px;cursor:pointer}
.soloPower img{width:28px;height:28px;object-fit:contain}
.soloPower:disabled{opacity:.45;filter:grayscale(1);cursor:default}
.challenge-progress{font-size:10px;line-height:1.15}
.mobile-controls{display:none}
.touch-button{min-width:52px;min-height:48px;border:4px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-weight:700;box-shadow:0 4px 0 var(--ink);touch-action:none}
.touch-button.action{background:#ffe66d}
.comboBadge{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;background:#ffd93d;color:var(--ink);border:4px solid var(--ink);border-radius:99px;padding:4px 12px;font-size:16px;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
#arena.one .comboBadge.on{display:block;animation:pp .3s}
.pw{background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:18px;padding:10px 8px;box-shadow:0 6px 0 var(--ink);font-size:11px;text-align:center;transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:190px;width:100%;max-width:120px;box-sizing:border-box;gap:2px}
.pw.on{box-shadow:0 6px 0 var(--ink),0 0 0 5px var(--pc),0 0 26px var(--pc);animation:fl .6s infinite}
.pw .ph{display:none}
.sl{position:relative;display:flex;align-items:center;justify-content:center;width:100%;padding:6px 4px;margin-top:0;border:3px solid transparent;border-radius:12px;transition:.15s;font-size:12px;min-height:54px;box-sizing:border-box;transform-origin:center}
.pw.dense .sl{min-height:40px;padding:2px}
.pw.dense .sl .ic{width:36px;height:36px;font-size:23px}
.sl.power-enter{animation:powerEnter .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes powerEnter{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:scale(1);opacity:1}}
.sl .bubble{position:absolute;left:50%;top:-18px;transform:translate(-50%,-6px);white-space:nowrap;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:4px 10px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:11px;opacity:0;transition:.15s;pointer-events:none;text-shadow:none;z-index:3}
.sl .bubble::after{content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink)}
.sl .ic{width:52px;height:52px;display:grid;place-items:center;font-size:28px;position:relative;z-index:1}
.sl.swap .ic{width:40px;height:40px}
.sl img{width:100%;height:100%;object-fit:contain;display:block}
.sl.sel{background:var(--pc);color:#fff;border-color:var(--ink);transform:scale(1.12) rotate(-1.5deg);box-shadow:0 4px 0 var(--ink)}
.sl.sel .bubble,.sl:hover .bubble{opacity:1;transform:translate(-50%,0)}
.sl.used{opacity:.3;filter:grayscale(1)}
.pop{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:30px;-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;animation:up 1s forwards;pointer-events:none;z-index:5}
.idle-alert{position:absolute;inset:0 114px 0 0;display:grid;place-items:center;gap:4px;background:rgba(40,8,14,.32);border:4px solid #ff3b52;border-radius:18px;z-index:6;box-shadow:0 0 0 3px rgba(255,59,82,.35);animation:idlePulse 1s ease-in-out infinite,idleShake .35s ease-in-out infinite alternate}
.idle-alert.exploding{display:block;overflow:hidden;background:#160b35;border-color:#fff;animation:none}
.idle-video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;border-radius:12px;z-index:0}
.idle-alert:not(.exploding) .idle-number,.idle-alert:not(.exploding) .idle-text{position:relative;z-index:1}
.idle-number{font-size:clamp(42px,8vw,88px);line-height:1;-webkit-text-stroke:.12em var(--ink);paint-order:stroke fill;color:#ffdce0;text-shadow:0 6px 0 var(--ink)}
.idle-text{font-size:clamp(18px,2vw,24px);font-weight:700;-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;color:#fff;text-shadow:0 4px 0 var(--ink)}
@keyframes idlePulse{50%{box-shadow:0 0 0 5px rgba(255,59,82,.48),0 0 18px rgba(255,59,82,.45)}}
@keyframes idleShake{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}
@keyframes up{to{transform:translateY(-90px) scale(1.3);opacity:0}}
@keyframes timePop{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
#timer.timer-pop{animation:timePop .8s ease-out,shk .3s infinite}
#timer.timer-pop.green{background:#42d27d;color:#fff}
/* diálogos */
#dlg{position:fixed;inset:0;background:rgba(30,10,70,.65);display:none;place-items:center;z-index:9;backdrop-filter:blur(5px)}
#dlg.on{display:grid}
.dbox{background:linear-gradient(#fff,#ffeefb);color:var(--ink);border:6px solid var(--ink);border-radius:36px;padding:26px 36px 34px;text-align:center;box-shadow:0 14px 0 var(--ink);animation:pp .5s cubic-bezier(.2,1.6,.4,1);max-width:min(92vw,580px)}
#dlg.match-result .dbox{width:min(92vw,620px);max-height:88vh;overflow:auto}
@keyframes pp{from{transform:scale(.3) rotate(-8deg);opacity:0}}
#dt{font-size:44px;color:var(--pink);-webkit-text-stroke:.1em var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#db{font-size:19px;margin-top:8px}
#db h3{font-size:30px}
.result-table{width:100%;margin-top:16px;border-collapse:separate;border-spacing:0;border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;font-size:clamp(13px,2.4vw,17px)}
.result-table th,.result-table td{padding:9px 7px;border-right:2px solid rgba(43,22,80,.18);border-bottom:2px solid rgba(43,22,80,.18)}
.result-table th{background:#ffe66d}
.result-table tr:last-child td{border-bottom:0}
.result-table th:last-child,.result-table td:last-child{border-right:0}
#dbtns{display:flex;gap:18px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.cg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;text-align:left;align-items:center;font-size:17px}
@media(max-width:700px){
  html,body{overflow-x:hidden}
  body{overflow-y:auto;min-height:100%;height:auto;align-items:start}
  section{min-height:100vh}
  #game{padding:8px 4px 14px;gap:8px}
  #arena{gap:6px;max-width:100vw}
  #cards{width:100vw;overflow:clip}
  .pl{min-width:0}
  .tag{font-size:16px;padding:0 12px;margin-bottom:6px}
  .chips{gap:2px;margin-bottom:8px}
  .chips b{font-size:8px;padding:2px;border-width:2px}
  .chips i{font-size:13px}
  .bw canvas.main{height:min(48vh,68vw,420px);width:auto;border-width:4px}
  .skill-side{width:min(104px,27vw);padding:5px;gap:5px;border-width:3px;border-radius:14px}
  .skill-side h3{font-size:10px}
  .skill-energy{padding:4px;border-width:2px}
  .skill-energy strong{font-size:9px}
  .skill-energy .energy-meter{height:10px;margin-top:3px}
  .skill-menu-trigger,.skill-activate{min-height:36px;padding:3px;font-size:9px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
  .selected-skill{min-height:35px;padding:3px;font-size:8px}
  .selected-skill b{font-size:9px}
  .sd{width:76px;margin-left:0;gap:5px}
  .nx{font-size:9px;padding:4px;border-width:3px}
  .nx canvas{width:48px;height:48px}
  .pw{min-height:135px;padding:4px 2px;border-width:3px}
  .sl{min-height:38px;padding:2px}
  .sl .ic{width:34px;height:34px;font-size:22px}
  .soloExtras{gap:5px}
  .missionCard,.holdCard{padding:4px 2px;border-width:3px;font-size:9px}
  .holdCard canvas{width:40px;height:40px}
  .soloPower{font-size:9px;min-height:38px}
  .soloPower img{width:21px;height:21px}
  .mobile-controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:min(96vw,520px);padding:4px}
  .touch-button{min-width:0;min-height:44px;font-size:13px}
  .game-hud{gap:5px}
  .hud-pill{font-size:11px;padding:3px 8px}
  .skill-dialog{padding:12px;border-width:4px;border-radius:20px}
  .ability-list{grid-template-columns:1fr;gap:7px}
  .ability-button{min-height:60px;padding:6px}
  .ability-footer{align-items:stretch;flex-direction:column}
  .ability-footer .skill-activate{width:100%}
  .skill-hint{text-align:center}
  #dlg.match-result .dbox{padding:16px 10px 20px}
}
body[data-scene="zen"] .zen-game-control{display:flex}
body[data-scene="zen"] .touch-button[data-command="SELECT"]{display:none}
@media(max-width:600px){body[data-scene="zen"] #game .game-hud{gap:5px}.zen-ability-button{min-width:118px;padding:4px 8px}.zen-ability-copy{font-size:10px}.zen-ability-copy small{font-size:8px}.zen-ability-ring{width:30px;height:30px}.zen-pause-button{width:38px;min-height:38px}}

<audio id="classic-music" loop preload="auto"><source src="./classic.mp3" type="audio/mpeg"></audio>

    <span class="pill" id="pp1">P1 · sem controle</span>

  <div id="timer" class="hide">2:00</div>
  <div class="game-hud"><span class="hud-pill" id="mode-label"></span><button class="zen-game-control zen-ability-button" id="zen-clear-button" type="button" aria-label="Limpar uma linha com blocos, atalho X do teclado" aria-disabled="false">
    <span class="zen-ability-ring" aria-hidden="true"><svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="16"></circle><circle class="progress" id="zen-cooldown-progress" cx="18" cy="18" r="16"></circle></svg><strong class="zen-ability-status" id="zen-cooldown-status">READY</strong></span>
    <span class="zen-ability-copy">LIMPAR LINHA<small id="zen-ability-hint">X · sem custo</small></span></button><button class="zen-game-control zen-pause-button" id="zen-pause-button" type="button" aria-label="Pausar partida">Ⅱ</button></div>

  /* velocidade: cada peça colocada deixa a queda mais rápida */

  hasAbilityTarget(id){if(id==='bomb'||id==='clear')return this.b.some(row=>row.some(Boolean));

  activateBomb(){const occupied=[];this.b.forEach((row,y)=>row.forEach((v,x)=>{if(v)occupied.push({x,y})}));

function start(n,soloMode='classic',challengeId=selectedChallenge){clearTouchRepeats();cleanupPowerEffects();if(timerBonusTimeout){clearTimeout(timerBonusTimeout);timerBonusTimeout=null}
  closeSkillsMenu();
  $('timer').classList.remove('timer-pop','green','timer-bonus');delete $('timer').dataset.bonus;count=n;gameMode=n===1?soloMode:'classic';selectedChallenge=challengeId;ended=false;applyScene(count===2?'multiplayer':gameMode);
  matchEndTimestamp=count===2||gameMode==='timeAttack'?performance.now()+POWERS_CONFIG.matchDuration:0;matchPausedAt=null;closeDlg();tsnd.pause();
  games.forEach(g=>{g.hideIdleAlert();if(g.idleAudioTimer){clearTimeout(g.idleAudioTimer);g.idleAudioTimer=null}});
  activeAlerts=0;stopAlertSound(true);stopTntSound();document.querySelectorAll('.idle-alert').forEach(e=>e.remove());
  $('menu').classList.add('hide');$('game').classList.remove('hide');
  $('pl2').classList.toggle('hide',n<2);$('vs').classList.toggle('hide',n<2);
  document.querySelectorAll('.soloExtras').forEach(element=>element.classList.toggle('hide',n!==1));
  const zenMode=n===1&&gameMode==='zen',powerButton=document.querySelector('.touch-button[data-command="POWER"]');
  $('timer').classList.toggle('hide',n===1&&(gameMode==='classic'||gameMode==='zen'));$('arena').classList.toggle('one',n<2);$('arena').classList.toggle('zen',zenMode);$('mobile-controls').classList.toggle('hide',n!==1);
  if(powerButton){powerButton.textContent=zenMode?'🌿 LIMPAR LINHA':'💣';powerButton.setAttribute('aria-label',zenMode?'Limpar uma linha com blocos':'Usar bomba')}
  games=[1,2].slice(0,n).map(p=>new Game(p));if(n===2){games[0].opp=games[1];games[1].opp=games[0]}
  $('mode-label').textContent=n===2?'MULTIJOGADOR':SOLO_MODES.find(m=>m.id===gameMode)?.name||'CLÁSSICO';
  $('timer').classList.remove('u');$('timer').textContent=n===2||gameMode==='timeAttack'?'2:00':'0:00';
  updateDailyOnStart();mode='game';updateMatchTimer();playMusicForCurrentMode();sfx(440,.3,'triangle',.08,2)}
function toMenu(){clearTouchRepeats();closeSkillsMenu();cleanupPowerEffects();if(timerBonusTimeout){clearTimeout(timerBonusTimeout);timerBonusTimeout=null}
  $('timer').classList.remove('timer-pop','green','timer-bonus','u');delete $('timer').dataset.bonus;closeDlg();tsnd.pause();tsnd.currentTime=0;games.forEach(g=>{g.hideIdleAlert();if(g.idleAudioTimer){clearTimeout(g.idleAudioTimer);g.idleAudioTimer=null}});
  activeAlerts=0;stopAlertSound(true);stopTntSound();document.querySelectorAll('.idle-alert').forEach(e=>e.remove());games=[];matchPausedAt=null;$('game').classList.add('hide');$('menu').classList.remove('hide');mode='menu';menu.idx=0;playMusicForCurrentMode();mark();applyScene('menu')}
function resume(){if(matchPausedAt!==null){matchEndTimestamp+=performance.now()-matchPausedAt;matchPausedAt=null}
  const now=performance.now();closeDlg();games.forEach(g=>{if(gameMode==='zen'&&g.zenClearPauseRemaining!==null){g.zenClearReadyAt=now+g.zenClearPauseRemaining;g.zenClearPauseRemaining=null}
    g.paused=false;g.lastAct=now;g.resumeIdleVideo()});if(activeAlerts>0)scheduleTntSound();mode='game';if(gameMode==='zen')games[0]?.updateZenAbilityUI();if(count===2||gameMode==='timeAttack')updateMatchTimer();playMusicForCurrentMode()}
function pause(){if((count===2||gameMode==='timeAttack')&&matchPausedAt===null)matchPausedAt=performance.now();games.forEach(g=>{if(gameMode==='zen'&&g.zenClearPauseRemaining===null)g.zenClearPauseRemaining=Math.max(0,g.zenClearReadyAt-performance.now());
    g.paused=true;g.pauseIdleVideo();if(gameMode==='zen')g.updateZenAbilityUI()});tsnd.pause();stopTntSound(false);dlg('PAUSADO','Respira e volta com tudo! 🧘',[{t:'CONTINUAR',c:'green',f:resume},{t:'SAIR',c:'red',f:toMenu}],resume)}
function showCtrl(){const close=()=>{closeDlg();mode='menu';mark()};
  dlg('CONTROLES',`<div class="cg"><span><b class="k">◀</b><b class="k">▶</b></span><i style="font-style:normal">Mover a peça · escolher no menu</i>
  <span><b class="k">▲</b></span><i style="font-style:normal">Girar a peça · voltar</i>
  <span><b class="k">▼</b></span><i style="font-style:normal">Descer (segure = mais rápido) · CLICAR</i>
  <span><b class="k">B</b></span><i style="font-style:normal">Queda instantânea ⚡</i>
  <span><b class="k">K / C</b></span><i style="font-style:normal">Joystick K / teclado C: guardar peça (1P) · abrir poderes (2P)</i>
  <span><b class="k">E</b></span><i style="font-style:normal">Voltar nos menus · abrir habilidades durante a partida (inclui Zen)</i>
  <span><b class="k">F</b></span><i style="font-style:normal">Ativar habilidade selecionada · limpar linha no Zen</i>
  <span><b class="k">X</b></span><i style="font-style:normal">Poder carregado · limpar linha no Zen</i>
  <span><b class="k">R</b></span><i style="font-style:normal">Reiniciar a partida (teclado)</i>
  <span><b class="k">◀▶ ▼</b></span><i style="font-style:normal">Nos poderes: ◀▶ escolhe, ▼ usa, ▲/K fecha</i>
  <span><b class="k">ESC</b></span><i style="font-style:normal">Pausar ⏸</i></div>`,[{t:'ENTENDI!',c:'green',f:close}],close)}
function end(o,reason){if(ended)return;closeSkillsMenu();clearTouchRepeats();
  const endReason=reason||((count===2||gameMode==='timeAttack')&&matchTimeRemaining()<=0?'time':o?.idle?'idle':'topout');
  ended=true;mode='wait';playMusicForCurrentMode();matchPausedAt=null;cleanupPowerEffects();if(timerBonusTimeout){clearTimeout(timerBonusTimeout);timerBonusTimeout=null}
  $('timer').classList.remove('timer-pop','green','timer-bonus');delete $('timer').dataset.bonus;tsnd.pause();tsnd.currentTime=0;games.forEach(g=>{g.paused=true;g.hideIdleAlert();if(g.idleAudioTimer){clearTimeout(g.idleAudioTimer);g.idleAudioTimer=null}});
  activeAlerts=0;stopAlertSound(true);stopTntSound();document.querySelectorAll('.idle-alert').forEach(e=>e.remove());
  if(count===1){const single=games[0],playedSeconds=Math.floor(single.modeElapsedMs/1000);
    playerProgress.games++;playerProgress.lines+=single.lines;playerProgress.score+=single.score;playerProgress.seconds+=playedSeconds;
    playerProgress.highestCombo=Math.max(playerProgress.highestCombo,single.maxCombo);
    addPlayerXP(Math.max(10,Math.floor(single.score/100)+single.lines*2));
    if(playerProgress.games===1)single.unlockAchievement('first-game','PRIMEIRA PARTIDA');
    if(playerProgress.lines>=100)single.unlockAchievement('lines-100','100 LINHAS');
    if(single.score>=5000)single.unlockAchievement('score-5000','5.000 PONTOS');
    if(single.maxCombo>=3)single.unlockAchievement('combo-3','COMBO 3x');
    savePlayerProgress();const resultHeading=endReason==='challenge'?'DESAFIO COMPLETO!':endReason==='challenge-timeout'?'TEMPO DO DESAFIO!':'FIM DE JOGO';
    const h=`<h3>${single.score} pontos</h3><p>${single.lines} linhas · ${single.maxCombo}x combo</p><p>${gameMode==='survival'?`Sobreviveu ${formatMatchTime(single.modeElapsedMs)}`:`Tempo ${formatMatchTime(single.modeElapsedMs)}`}</p>`+
      (single.score>single.hi0?'<p>🏆 NOVO RECORDE!</p>':'')+(endReason==='challenge'?'🎯 Missão concluída · +80 XP':'');
    const resultDelay=single.idleExploded?250:1800,resultMode=gameMode,resultChallenge=selectedChallenge;
    setTimeout(()=>dlg(resultHeading,h,[{t:'JOGAR DE NOVO',c:'green',f:()=>start(1,resultMode,resultChallenge)},{t:'MENU',c:'blue',f:toMenu}],null),resultDelay);return}
  const topOuts=games.filter(g=>g.over&&!g.idle),idleOuts=games.filter(g=>g.over&&g.idle);
  let winner=0,outcome;
  if(endReason==='time'){winner=games[0].score>games[1].score?1:games[1].score>games[0].score?2:0;outcome=winner?`🏆 JOGADOR ${winner} VENCEU NO TEMPO!`:'🤝 EMPATE!'}
  else if(endReason==='idle'){winner=idleOuts.length===1?(idleOuts[0]===games[0]?2:1):0;outcome=winner?`🏆 JOGADOR ${winner} VENCEU POR INATIVIDADE!`:'🤝 EMPATE!'}
  else{winner=topOuts.length===1?(topOuts[0]===games[0]?2:1):games[0].score>games[1].score?1:games[1].score>games[0].score?2:0;
    outcome=winner?`🏆 JOGADOR ${winner} VENCEU!`:'🤝 EMPATE!'}
  const h=`<p class="result-outcome">${outcome}</p><table class="result-table"><thead><tr><th>JOGADOR</th><th>PONTOS</th><th>COMBOS</th><th>LINHAS</th></tr></thead><tbody>${games.map(g=>`<tr><th>P${g.p}</th><td>${g.score}</td><td>${g.combos}</td><td>${g.lines}</td></tr>`).join('')}</tbody></table><p>${endReason==='time'?'⏱ Tempo esgotado':endReason==='idle'?'⚠ Fim por inatividade':'🧱 Campo sem espaço'}</p>`;
  const resultDelay=games.some(g=>g.idleExploded)?250:1800;
  setTimeout(()=>{dlg('FIM DE PARTIDA',h,[{t:'JOGAR DE NOVO',c:'green',f:()=>start(count)},{t:'MENU',c:'blue',f:toMenu}],null);$('dlg').classList.add('match-result')},resultDelay)}

function loop(t){const dt=Math.min(50,t-last);last=t;
  if(games.length){
    if(skillsMenuOpen&&games[0]&&performance.now()-games[0].abilityUiAt>=200){games[0].abilityUiAt=performance.now();games[0].updateAbilityUI()}
    if(mode==='game'&&!ended&&(count===2||gameMode!=='classic'&&gameMode!=='zen'))updateMatchTimer();
    games.forEach(g=>{g.update(dt);g.draw()});
    if(!ended&&mode==='game'){const o=games.find(g=>g.over);const waitingForExplosion=games.some(g=>g.idleExploded&&!g.idleVideoDone);
      if((o||(count===2||gameMode==='timeAttack')&&matchTimeRemaining()<=0)&&!waitingForExplosion)end(o,o?(o.idle?'idle':'topout'):'time')}}
  requestAnimationFrame(loop)}

/* ───── Arduino (Web Serial) — o jogador é detectado pelo prefixo P1:/P2: ───── */
function setPill(p,on){const e=$('pp'+p);e.classList.toggle('ok',on);e.textContent=`P${p} · ${on?'conectado ✓':'sem controle'}`}
function fromSerial(p,cmd){const rep=cmd.endsWith('_HOLD'),received=rep?cmd.slice(0,-5):cmd;
  const command={E:'SKILLS',F:'SKILL',K:'BTN_A'}[received]||received;
  if(new URLSearchParams(location.search).get('debug')==='1'&&['E','F','K'].includes(received))
    console.info(`Arduino P${p}: botão ${received} → ${command}`);
  input(p,command,rep)}
async function openPort(port){let who=0;
  try{await port.open({baudRate:9600});const rd=port.readable.pipeThrough(new TextDecoderStream()).getReader();let buf='';
    for(;;){const{value,done}=await rd.read();if(done)break;buf+=value;const ls_=buf.split('\n');buf=ls_.pop();
      for(const l of ls_){const line=l.trim(),ready=line.match(/^ARDUINO_P([12])_READY$/),m=line.match(/^P([12]):(\w+)$/),player=ready?.[1]||m?.[1];if(!player)continue;
        if(who!==+player){who=+player;setPill(who,true);sfx(700,.15,'triangle',.08,1.5)}
        if(m)fromSerial(who,m[2])}}
  }catch(e){console.error('Arduino serial connection failed',e)}
  if(who)setPill(who,false)}
$('cn').onclick=async()=>{startAudio();
  if(!('serial' in navigator))return alert('Web Serial API não suportada!\nUse Chrome ou Edge.');
  try{openPort(await navigator.serial.requestPort())}catch(e){if(e.name!=='NotFoundError')alert('Erro ao conectar: '+e.message)}};
navigator.serial?.getPorts().then(ps=>ps.forEach(openPort)).catch(error=>console.error('Unable to list Arduino serial ports',error));

addEventListener('pointerdown',startAudio);
addEventListener('beforeunload',()=>navigator.serial?.getPorts().then(ps=>ps.forEach(p=>p.close().catch(error=>console.error('Unable to close Arduino serial port',error)))));

applyTheme();refreshDailyProgress();$('player-level').textContent=`NÍVEL ${playerProgress.level} · ${playerProgress.xp} XP`;
installControls();mark();requestAnimationFrame(loop);
</script>
