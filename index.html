<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS POP! — Arduino Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="shortcut icon" href="./image.jpg" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1650;--pink:#ff5fa2;--blue:#4da6ff;--yel:#ffd93d;--grn:#5be37d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;color:#fff;overflow:hidden;user-select:none;display:grid;place-items:center;background:linear-gradient(160deg,#5b3df5,#a04dff 45%,#ff6fb5)}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 40px,transparent 40px 80px);animation:slide 6s linear infinite}
@keyframes slide{to{background-position:113px 0}}
.hide{display:none!important}
#bg{position:fixed;inset:0;overflow:hidden;perspective:800px;pointer-events:none}
.fb{position:absolute;bottom:-120px;border:4px solid var(--ink);border-radius:28%;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),inset 6px 6px 0 rgba(255,255,255,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotateX(360deg) rotateY(300deg) rotateZ(200deg)}}
section{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
/* botões */
.btn{font:inherit;font-weight:700;font-size:22px;color:#fff;padding:.6em 1.4em;border:5px solid var(--ink);border-radius:20px;background:var(--b,#4da6ff);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 8px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.15),inset 0 6px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .15s,filter .15s}
.btn.green{--b:#2fcf6a}.btn.red{--b:#ff5252}.btn.blue{--b:#4da6ff}
.btn.sel,.btn:hover{transform:translateY(-4px) scale(1.1) rotate(-1.5deg);filter:brightness(1.1)}
.btn.sel::before{content:'▶ '}
.btn.press,.btn:active{transform:translateY(7px) scale(1.02);box-shadow:0 1px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.15)}
.k{display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 8px;border-radius:12px;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);margin:0 4px;font-weight:700}
/* menu */
#menu{gap:2.4vh}
.logo{display:flex;gap:.5vw;font-size:min(14vw,128px);line-height:1;transform:perspective(700px) rotateX(16deg)}
.logo span{color:var(--c);-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;animation:bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.13s);text-shadow:0 .04em 0 var(--ink),0 .08em 0 var(--ink),0 .12em 0 var(--ink),0 .16em 0 var(--ink),0 .2em 0 #1a0b33,0 .34em .2em rgba(0,0,0,.35)}
@keyframes bob{50%{transform:translateY(-.1em) rotate(var(--r,3deg))}}
.sub{background:var(--yel);color:var(--ink);padding:.3em 1.1em;border-radius:99px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);font-size:min(3vw,22px)}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{padding:.3em 1em;border-radius:99px;border:4px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);font-size:16px;transition:.3s}
.pill.ok{background:var(--grn);animation:pp .5s}
#cards{position:relative;height:min(44vh,370px);width:min(94vw,900px);perspective:1100px;margin:1vh 0 3vh}
.card{--w:min(30vw,250px);position:absolute;left:50%;top:0;width:var(--w);margin-left:calc(var(--w)/-2);height:100%;border:6px solid var(--ink);border-radius:32px;background:var(--cc);box-shadow:0 12px 0 var(--ink),inset 0 -14px 0 rgba(0,0,0,.16),inset 0 10px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;text-align:center;cursor:pointer;text-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .3s,filter .3s}
.card .ic{font-size:min(10vh,84px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:bob 2s ease-in-out infinite}
.card h2{font-size:min(4.2vh,32px)}
.card p{font-size:min(2.3vh,17px);padding:0 14px;opacity:.95}
.card.sel{filter:brightness(1.1);border-color:#fff;outline:6px solid var(--ink)}
.card.sel::after{content:'▼ APERTE BAIXO';position:absolute;bottom:-58px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:99px;padding:.15em .9em;font-size:16px;text-shadow:none;box-shadow:0 4px 0 var(--ink);animation:hint .8s ease-in-out infinite alternate}
@keyframes hint{to{transform:translateY(8px)}}
.card.press{transform:translateY(14px) scale(1)!important}
.keys{display:flex;gap:6px;align-items:center;margin-top:2vh;font-size:18px;flex-wrap:wrap;justify-content:center}
/* jogo */
#game{gap:1vh}
#timer{font-size:34px;background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:20px;padding:0 .8em;box-shadow:0 6px 0 var(--ink)}
#timer.u{background:#ff5252;color:#fff;animation:shk .3s infinite}
#arena{display:flex;gap:min(3vw,36px);align-items:flex-start;justify-content:center}
#vs{align-self:center;font-size:54px;color:var(--yel);-webkit-text-stroke:.1em var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);animation:bob 1s infinite}
.pl{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{translate:0 -8px}}
.tag{display:inline-block;background:var(--pc);border:4px solid var(--ink);border-radius:14px;padding:0 20px;font-size:22px;box-shadow:0 5px 0 var(--ink);margin-bottom:10px;transform:rotate(-3deg)}
.tilt{transform:perspective(1100px) rotateY(var(--ry)) rotateX(5deg)}
#arena.one .pl{--ry:0deg!important}
.sk{animation:shk .25s}
@keyframes shk{25%{translate:-6px 4px}75%{translate:6px -3px}}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips b{flex:1;font-size:11px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:3px 8px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.chips i,.nx i{display:block;font-style:normal;font-size:20px;color:var(--pc)}
.bw{position:relative;display:flex;align-items:flex-start}
.bw canvas.main{height:min(62vh,560px);width:auto;border:6px solid var(--ink);border-radius:20px;background:#2a1a5e;box-shadow:0 10px 0 var(--ink),0 0 0 6px var(--pc),0 0 40px var(--pc)}
.sd{display:flex;flex-direction:column;gap:10px;margin-left:16px;width:108px}
.nx{display:flex;flex-direction:column;gap:4px;align-items:center;background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:18px;padding:8px;box-shadow:0 6px 0 var(--ink);font-size:12px}
.nx canvas{width:72px;height:72px}
#arena.one .pw{display:none}
.soloExtras{display:none;flex-direction:column;gap:9px}
#arena.one .soloExtras{display:flex}
.missionCard,.holdCard{width:100%;background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:16px;padding:7px 5px;text-align:center;box-shadow:0 5px 0 var(--ink);font-size:11px}
.missionCard b,.holdCard b{display:block;font-size:11px}
.missionCard span{display:block;margin-top:3px;line-height:1.15}
.missionCard i{display:block;font-style:normal;font-size:15px;color:var(--pc);margin-top:3px}
.holdCard{display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;cursor:pointer}
.holdCard canvas{width:58px;height:58px}
.holdCard small{font-size:9px;opacity:.75}
.soloPower{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border:4px solid var(--ink);border-radius:14px;background:#ffe66d;color:var(--ink);box-shadow:0 5px 0 var(--ink);font:inherit;font-weight:700;font-size:11px;cursor:pointer}
.soloPower img{width:28px;height:28px;object-fit:contain}
.soloPower:disabled{opacity:.45;filter:grayscale(1);cursor:default}
.comboBadge{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;background:#ffd93d;color:var(--ink);border:4px solid var(--ink);border-radius:99px;padding:4px 12px;font-size:16px;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
#arena.one .comboBadge.on{display:block;animation:pp .3s}
.pw{background:#fff;color:var(--ink);border:5px solid var(--ink);border-radius:18px;padding:10px 8px;box-shadow:0 6px 0 var(--ink);font-size:11px;text-align:center;transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:190px;width:100%;max-width:120px;box-sizing:border-box;gap:2px}
.pw.on{box-shadow:0 6px 0 var(--ink),0 0 0 5px var(--pc),0 0 26px var(--pc);animation:fl .6s infinite}
.pw .ph{display:none}
.sl{position:relative;display:flex;align-items:center;justify-content:center;width:100%;padding:6px 4px;margin-top:0;border:3px solid transparent;border-radius:12px;transition:.15s;font-size:12px;min-height:54px;box-sizing:border-box;transform-origin:center}
.sl .bubble{position:absolute;left:50%;top:-18px;transform:translate(-50%,-6px);white-space:nowrap;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:4px 10px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:11px;opacity:0;transition:.15s;pointer-events:none;text-shadow:none;z-index:3}
.sl .bubble::after{content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink)}
.sl .ic{width:52px;height:52px;display:grid;place-items:center;font-size:28px;position:relative;z-index:1}
.sl.swap .ic{width:40px;height:40px}
.sl img{width:100%;height:100%;object-fit:contain;display:block}
.sl.sel{background:var(--pc);color:#fff;border-color:var(--ink);transform:scale(1.12) rotate(-1.5deg);box-shadow:0 4px 0 var(--ink)}
.sl.sel .bubble,.sl:hover .bubble{opacity:1;transform:translate(-50%,0)}
.sl.used{opacity:.3;filter:grayscale(1)}
.pop{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:30px;-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;animation:up 1s forwards;pointer-events:none;z-index:5}
.idle-alert{position:absolute;inset:0 114px 0 0;display:grid;place-items:center;gap:4px;background:rgba(40,8,14,.32);border:4px solid #ff3b52;border-radius:18px;z-index:6;box-shadow:0 0 0 3px rgba(255,59,82,.35);animation:idlePulse 1s ease-in-out infinite,idleShake .35s ease-in-out infinite alternate}
.idle-alert.exploding{display:block;overflow:hidden;background:#160b35;border-color:#fff;animation:none}
.idle-video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;border-radius:12px;z-index:0}
.idle-alert:not(.exploding) .idle-number,.idle-alert:not(.exploding) .idle-text{position:relative;z-index:1}
.idle-number{font-size:clamp(42px,8vw,88px);line-height:1;-webkit-text-stroke:.12em var(--ink);paint-order:stroke fill;color:#ffdce0;text-shadow:0 6px 0 var(--ink)}
.idle-text{font-size:clamp(18px,2vw,24px);font-weight:700;-webkit-text-stroke:.08em var(--ink);paint-order:stroke fill;color:#fff;text-shadow:0 4px 0 var(--ink)}
@keyframes idlePulse{50%{box-shadow:0 0 0 5px rgba(255,59,82,.48),0 0 18px rgba(255,59,82,.45)}}
@keyframes idleShake{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}
@keyframes up{to{transform:translateY(-90px) scale(1.3);opacity:0}}
@keyframes timePop{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
#timer.timer-pop{animation:timePop .8s ease-out,shk .3s infinite}
#timer.timer-pop.green{background:#42d27d;color:#fff}
/* diálogos */
#dlg{position:fixed;inset:0;background:rgba(30,10,70,.65);display:none;place-items:center;z-index:9;backdrop-filter:blur(5px)}
#dlg.on{display:grid}
.dbox{background:linear-gradient(#fff,#ffeefb);color:var(--ink);border:6px solid var(--ink);border-radius:36px;padding:26px 36px 34px;text-align:center;box-shadow:0 14px 0 var(--ink);animation:pp .5s cubic-bezier(.2,1.6,.4,1);max-width:min(92vw,580px)}
@keyframes pp{from{transform:scale(.3) rotate(-8deg);opacity:0}}
#dt{font-size:44px;color:var(--pink);-webkit-text-stroke:.1em var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#db{font-size:19px;margin-top:8px}
#db h3{font-size:30px}
#dbtns{display:flex;gap:18px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.cg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;text-align:left;align-items:center;font-size:17px}
@media(prefers-reduced-motion:reduce){.fb,body::before{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<audio id="lobby-music" loop preload="auto"><source src="./lobby_music.mp3" type="audio/mpeg"></audio>
<audio id="single-player-music" loop preload="auto"><source src="./single_player.mp3" type="audio/mpeg"></audio>
<audio id="multiplayer-music" loop preload="auto"><source src="./multiplayer.mp3" type="audio/mpeg"></audio>
<audio id="alert-sound" loop preload="auto"><source src="./alert.mp3" type="audio/mpeg"></audio>
<audio id="explosion-sound" preload="auto"><source src="./explosion.mp3" type="audio/mpeg"></audio>
<audio id="tnt-sound" preload="auto"><source src="./tnt.mp3" type="audio/mpeg"></audio>
<audio id="timer-sound" loop preload="auto"><source src="./timer.mp3" type="audio/mpeg"></audio>

<section id="menu">
  <div class="logo" id="logo"></div>
  <div class="sub">★ POP! EDITION · ARDUINO ★</div>
  <div class="bar">
    <span class="pill" id="pp1">P1 · sem controle</span>
    <button class="btn blue" id="cn" style="font-size:16px">🔌 CONECTAR CONTROLE</button>
    <span class="pill" id="pp2">P2 · sem controle</span>
  </div>
  <div id="cards"></div>
  <div class="keys"><span class="k">◀</span><span class="k">▶</span> escolher <span class="k">▼</span> confirmar</div>
</section>

<section id="game" class="hide">
  <div id="timer" class="hide">2:00</div>
  <div id="arena"></div>
</section>

<div id="dlg"><div class="dbox"><div id="dt"></div><div id="db"></div><div id="dbtns"></div></div></div>

<script>
const $=id=>document.getElementById(id),COLS=10,ROWS=20,BS=28,INK='#2b1650';
const ls=k=>{try{return localStorage.getItem(k)}catch{}},ss=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const SH=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
const COL=[0,['#6ee7ff','#1aa7d6'],['#ffe66d','#e0a800'],['#c792ff','#8a4fe0'],['#7dff8a','#2fbf4a'],['#ff8a8a','#e03c3c'],['#7ba5ff','#3560d9'],['#ffb86b','#e57b1a'],['#b8b2c8','#7d7694']];

/* ───── configuração de velocidade e poderes ───── */
const SPEED={start:800,decay:.965,min:70,soft:45,softHold:130};
const IDLE={warnAfter:12000,countdown:5000,videoLead:1000};
// ícones: coloque seus PNGs em ./icons/ (se não existir, aparece o emoji)
const POWERS=[
 {id:'bomb', n:'BOMBA', e:'💣', img:'./bomba.png'},
 {id:'swap', n:'TROCA', e:'🔄', img:'./reverse.png'},
 {id:'time', n:'+1 MINUTO', e:'⏱️', img:'./one_more_minutes.png'}];

/* ───── fundo e logo ───── */
for(let i=0;i<18;i++){const e=document.createElement('div'),s=28+Math.random()*50;e.className='fb';e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${COL[1+i%7][0]};animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*25}s`;$('bg').append(e)}
$('logo').innerHTML=[...'TETRIS'].map((l,i)=>`<span style="--i:${i};--r:${i%2?-4:4}deg;--c:${['#ff5fa2','#ffb400','#ffe66d','#5be37d','#4da6ff','#c792ff'][i]}">${l}</span>`).join('');

/* ───── áudio ───── */
let AC,music=true,started=false;const lobbyMusic=$('lobby-music'),singlePlayerMusic=$('single-player-music'),multiplayerMusic=$('multiplayer-music'),alertSound=$('alert-sound'),explosionSound=$('explosion-sound'),tntSound=$('tnt-sound'),tsnd=$('timer-sound');
const musicTracks=[lobbyMusic,singlePlayerMusic,multiplayerMusic];
let activeAlerts=0,alertFallbackTimer=null,tntStartTimer=null;
musicTracks.forEach(track=>track.volume=.4);alertSound.volume=.6;explosionSound.volume=.9;tntSound.volume=.9;
function stopAllMusic(){musicTracks.forEach(track=>{track.pause();track.currentTime=0})}
function primeAudio(audio,vol){if(!audio)return;audio.volume=0;audio.currentTime=0;audio.pause();audio.play().catch(()=>{});setTimeout(()=>{audio.pause();audio.currentTime=0;audio.volume=vol},50)}
function playMusicForCurrentMode(){
  if(!music)return;
  const desired = mode==='menu'||mode==='dlg' ? lobbyMusic : count===2 ? singlePlayerMusic : multiplayerMusic;
  musicTracks.forEach(track=>{if(track!==desired){track.pause();track.currentTime=0}});
  desired.play().catch(()=>{})
}
function stopAlertSound(force=false){if(activeAlerts>0&&!force)return;alertSound.pause();alertSound.currentTime=0;if(alertFallbackTimer){clearInterval(alertFallbackTimer);alertFallbackTimer=null}}
function playTntSound(){tntStartTimer=null;if(!tntSound.paused&&!tntSound.ended)return;tntSound.currentTime=0;tntSound.play().catch(()=>sfx(120,.5,'sawtooth',.12,.25))}
function scheduleTntSound(delay=IDLE.videoLead){if(tntStartTimer||(!tntSound.paused&&!tntSound.ended))return;tntStartTimer=setTimeout(playTntSound,delay)}
function stopTntSound(reset=true){if(tntStartTimer){clearTimeout(tntStartTimer);tntStartTimer=null}tntSound.pause();if(reset)tntSound.currentTime=0}
function playAlertSound(){if(!music)return;activeAlerts=Math.max(0,activeAlerts);if(activeAlerts===0)return;alertSound.addEventListener('error',()=>{if(alertFallbackTimer)return;alertFallbackTimer=setInterval(()=>{if(activeAlerts>0)sfx(880,.12,'triangle',.08)},900)}, {once:true});
  if(alertSound.error){if(!alertFallbackTimer)alertFallbackTimer=setInterval(()=>{if(activeAlerts>0)sfx(880,.12,'triangle',.08)},900);return}
  alertSound.currentTime=0;alertSound.play().catch(()=>{if(!alertFallbackTimer)alertFallbackTimer=setInterval(()=>{if(activeAlerts>0)sfx(880,.12,'triangle',.08)},900)})}
function playExplosionSound(){if(explosionSound.error){sfx(70,.7,'sawtooth',.14,.2);return}explosionSound.currentTime=0;explosionSound.play().catch(()=>sfx(70,.7,'sawtooth',.14,.2))}
function sfx(f,d=.08,type='square',v=.05,sl=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(f*sl,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch{} }
function startAudio(){if(started)return;started=true;primeAudio(alertSound,.6);primeAudio(explosionSound,.9);primeAudio(tntSound,.9);playMusicForCurrentMode()}
function toggleMusic(){music=!music;if(music)playMusicForCurrentMode();else{stopAllMusic();stopAlertSound();}mark()}

/* ───── peças ───── */
function blk(c,gx,gy,i,bs,a=1){const[l,d]=COL[i],p=gx*bs,q=gy*bs,r=bs*.3,f=(x,y,w,h,rr,col)=>{c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,rr);c.fill()};c.globalAlpha=a;f(p+1,q+1,bs-2,bs-2,r,INK);f(p+3,q+3,bs-6,bs-6,r-2,d);f(p+3,q+3,bs-6,bs-10,r-2,l);c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.ellipse(p+bs*.32,q+bs*.3,bs*.12,bs*.07,-.6,0,7);c.fill();c.globalAlpha=1}

class Game{
  constructor(p){this.p=p;this.c=$('cv'+p).getContext('2d');this.pc=$('pv'+p).getContext('2d');this.hiKey=count===1?'ttr_hi_p1':'ttr_hi_mp_p'+p;this.hi=this.hi0=+(ls(this.hiKey)||0);this.opp=null;this.reset()}
  reset(){this.b=Array.from({length:ROWS},()=>Array(COLS).fill(0));this.score=this.lines=this.combo=this.pend=this.placed=0;this.lv=1;this.over=this.paused=false;this.t=0;this.parts=[];this.anim=null;this.fx=null;this.boomT=null;this.idle=false;this.idleLeadIn=IDLE.videoLead;this.idleCountdown=IDLE.countdown;this.lastAct=performance.now();
    this.flash=this.sd=this.lastSoft=this.pwLock=0;this.pu=[false,false,false];this.ps=0;this.pm=false;this.idleTimer=null;this.idleExploded=false;this.idleVideoDone=false;this.idleVideoFallback=false;this.idleVideoTimer=null;
    this.hold=null;this.holdUsed=false;this.missionTarget=4;this.missionProgress=0;this.missionsCompleted=0;this.powerCharges=0;
    this.bag=[];this.nxt=this.take();this.lockT=performance.now()+700;this.next();this.ui();this.drawHold();this.updateSoloUI();this.pui();this.hideIdleAlert()}
  take(){if(!this.bag.length)this.bag=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5);const m=SH[this.bag.pop()].map(r=>[...r]);return{m,x:COLS-m[0].length>>1,y:0}}
  hit(m,x,y){return m.some((r,j)=>r.some((v,i)=>v&&(x+i<0||x+i>=COLS||y+j>=ROWS||this.b[y+j][x+i])))}
  next(){while(this.pend>0){this.pend--;this.b.shift();const r=Array(COLS).fill(8);r[Math.random()*COLS|0]=0;this.b.push(r)}
    this.cur=this.nxt;this.nxt=this.take();this.holdUsed=false;this.drawNext();if(this.hit(this.cur.m,this.cur.x,this.cur.y))this.over=true}
  ok(){return this.cur&&!this.over&&!this.paused&&!this.fx}
  mv(dx,dy){if(!this.ok())return false;const c=this.cur;if(this.hit(c.m,c.x+dx,c.y+dy))return false;c.x+=dx;c.y+=dy;if(dx)sfx(330,.04,'square',.03);return true}
  rot(){if(!this.ok())return;const c=this.cur,m=c.m,R=m.length,C=m[0].length,n=Array.from({length:C},(_,i)=>Array.from({length:R},(_,j)=>m[R-1-j][i]));
    for(const k of[0,-1,1,-2,2])if(!this.hit(n,c.x+k,c.y)){c.m=n;c.x+=k;sfx(520,.07,'triangle',.05,1.5);return}}
  /* velocidade: cada peça colocada deixa a queda mais rápida */
  speed(){let s=Math.max(SPEED.min,SPEED.start*Math.pow(SPEED.decay,this.placed));
    if(this.sd>0)s=Math.min(s,SPEED.soft);   // segurando ▼ = queda turbinada
    return s}
  soft(rep){if(this.mv(0,1)){this.add(1);this.t=0}
    const n=performance.now();
    if(rep||n-this.lastSoft<300)this.sd=SPEED.softHold;  // detecta "segurar" mesmo sem _HOLD
    this.lastSoft=n}
  hard(){if(!this.ok())return;const c=this.cur;let n=0;while(!this.hit(c.m,c.x,c.y+1)){c.y++;n++}this.add(n*2);shake(this.p);this.settle()}
  settle(){this.placed++;const c=this.cur;c.m.forEach((r,j)=>r.forEach((v,i)=>v&&(this.b[c.y+j][c.x+i]=v)));sfx(140,.12,'sine',.12,.5);this.cur=null;
    const f=[];this.b.forEach((r,i)=>r.every(Boolean)&&f.push(i));
    if(f.length){this.anim={f,t:0};f.forEach(r=>{for(let k=0;k<16;k++)this.parts.push({x:Math.random()*COLS*BS,y:r*BS+BS/2,vx:(Math.random()-.5)*9,vy:-Math.random()*8-2,l:1,c:COL[1+Math.random()*7|0][0]})});sfx(660,.25,'triangle',.08,2)}
    else{this.combo=0;this.updateSoloUI();this.next()}}
  done(){const f=this.anim.f,n=f.length;f.forEach(r=>{this.b.splice(r,1);this.b.unshift(Array(COLS).fill(0))});this.anim=null;this.combo++;this.lines+=n;
    this.add([0,100,300,500,800][n]*this.lv+(this.combo-1)*50*this.lv+(count===1?this.combo*100*this.lv:0));this.lv=1+this.lines/10|0;
    pop(this.p,['','NICE!','DOUBLE!','TRIPLE!','TETRIS!!'][n]+(this.combo>1?' x'+this.combo:''));
    const g=[0,0,1,2,4][n];if(g&&this.opp){this.opp.pend+=g;pop(this.opp.p,'⚠ +'+g+' LIXO','#ff7b7b')}
    if(count===1)this.advanceMission(n);
    this.updateSoloUI();this.next()}
  add(n){this.score+=n;if(this.score>this.hi){this.hi=this.score;ss(this.hiKey,this.hi)}this.ui()}
  ui(){$('sc'+this.p).textContent=this.score;$('li'+this.p).textContent=this.lines;$('lv'+this.p).textContent=this.lv;$('hi'+this.p).textContent=this.hi}
  updateSoloUI(){const mission=$('missionText'+this.p),progress=$('missionProgress'+this.p),power=$('soloPower'+this.p),powerCount=$('soloPowerCount'+this.p),combo=$('combo'+this.p),hint=$('holdHint'+this.p);
    if(mission)mission.textContent=`Limpe ${this.missionTarget} linhas`;
    if(progress)progress.textContent=`${this.missionProgress}/${this.missionTarget}`;
    if(powerCount)powerCount.textContent=`BOMBA ×${this.powerCharges}`;
    if(power)power.disabled=!this.powerCharges||this.over;
    if(combo){combo.textContent=this.combo>1?`COMBO ×${this.combo}`:'';combo.classList.toggle('on',this.combo>1)}
    if(hint)hint.textContent=this.holdUsed?'Já guardou':'A para guardar';
  }
  advanceMission(lines){this.missionProgress+=lines;
    while(this.missionProgress>=this.missionTarget){this.missionProgress-=this.missionTarget;this.missionsCompleted++;this.missionTarget=4+Math.min(4,Math.floor(this.missionsCompleted/2));this.powerCharges=Math.min(3,this.powerCharges+1);this.add(300*this.lv);pop(this.p,'🎯 MISSÃO! +300');}
    this.updateSoloUI()}
  drawHold(){const canvas=$('hv'+this.p);if(!canvas)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,88,88);if(!this.hold)return;
    const m=this.hold,bs=20;ctx.save();ctx.translate((88-m[0].length*bs)/2,(88-m.length*bs)/2);m.forEach((r,y)=>r.forEach((v,x)=>v&&blk(ctx,x,y,v,bs)));ctx.restore()}
  holdPiece(){if(count!==1||!this.ok()||this.holdUsed)return;
    const current=this.cur.m.map(r=>[...r]);
    if(this.hold){const replacement=this.hold;this.hold=current;this.cur={m:replacement.map(r=>[...r]),x:COLS-replacement[0].length>>1,y:0};if(this.hit(this.cur.m,this.cur.x,this.cur.y))this.over=true}
    else{this.hold=current;this.next()}
    this.holdUsed=true;this.drawHold();this.updateSoloUI();sfx(620,.12,'triangle',.07,1.5)}
  activateSoloPower(){if(count!==1||mode!=='game'||this.over||this.paused||!this.powerCharges||this.fx||this.anim)return;
    const rows=[];for(let y=ROWS-1;y>=0&&rows.length<3;y--)if(this.b[y].some(Boolean))rows.push(y);
    if(!rows.length){pop(this.p,'SEM BLOCOS!','#ff7b7b');return}
    this.powerCharges--;const removed=new Set(rows);this.b=this.b.filter((_,y)=>!removed.has(y));while(this.b.length<ROWS)this.b.unshift(Array(COLS).fill(0));
    this.lines+=rows.length;this.lv=1+this.lines/10|0;this.add(rows.length*150*this.lv);this.advanceMission(rows.length);this.flash=1;this.parts=[];const W=COLS*BS;
    for(let k=0;k<60;k++)this.parts.push({x:Math.random()*W,y:(ROWS-1)*BS,vx:(Math.random()-.5)*12,vy:-Math.random()*10-2,l:1.2,c:COL[1+Math.random()*7|0][0]});
    this.updateSoloUI();this.ui();shake(this.p);pop(this.p,'💣 BOOM!');sfx(90,.45,'sawtooth',.12,.4)}

  /* ───── PODERES (só no modo 2 jogadores) ───── */
  showIdleAlert(){const bw=$('bw'+this.p);if(!bw)return;const box=document.createElement('div');box.className='idle-alert';box.innerHTML=`<div class="idle-number" hidden>${Math.max(1,Math.ceil(this.idleCountdown/1000))}</div><div class="idle-text">⚠ MEXA-SE!</div>`;bw.appendChild(box);this.playIdleExplosionVideo()}
  hideIdleAlert(){const bw=$('bw'+this.p);if(!bw) return;bw.querySelectorAll('.idle-alert').forEach(el=>{el.querySelector('video')?.pause();el.remove()});if(this.idleVideoTimer){clearTimeout(this.idleVideoTimer);this.idleVideoTimer=null}}
  pauseIdleVideo(){const video=$('bw'+this.p)?.querySelector('.idle-alert video');if(video)video.pause()}
  resumeIdleVideo(){const video=$('bw'+this.p)?.querySelector('.idle-alert video');if(video)video.play().catch(()=>{this.idleVideoFallback=true;if(this.idleExploded)this.startIdleExplosionFallback()})}
  playIdleExplosionVideo(){const box=$('bw'+this.p)?.querySelector('.idle-alert');if(!box){this.idleVideoDone=true;this.idleVideoFallback=true;return}
    const video=document.createElement('video');video.className='idle-video';video.src='./tnt.mp4';video.muted=true;video.playsInline=true;video.preload='auto';box.prepend(video);
    const finish=()=>{if(this.idleVideoDone)return;this.idleVideoDone=true;if(this.idleVideoTimer){clearTimeout(this.idleVideoTimer);this.idleVideoTimer=null}},
      fallback=()=>{if(!video.dataset.fallback){video.dataset.fallback='true';video.src='./explosion.mp4';video.load();video.play().catch(()=>{this.idleVideoFallback=true;if(this.idleExploded)this.startIdleExplosionFallback()});return}
        this.idleVideoFallback=true;if(this.idleExploded)this.startIdleExplosionFallback()};
    video.addEventListener('ended',finish,{once:true});video.addEventListener('error',fallback);
    this.idleVideoTimer=setTimeout(()=>{if(!this.idleVideoDone)fallback()},10000);
    video.play().catch(fallback)}
  startIdleExplosionFallback(){if(this.idleVideoDone)return;if(this.idleVideoTimer)clearTimeout(this.idleVideoTimer);this.boomT=0;this.idleVideoTimer=setTimeout(()=>{this.idleVideoDone=true;this.idleVideoTimer=null},1800)}
  cancelIdle(){this.idle=false;this.idleLeadIn=IDLE.videoLead;this.idleCountdown=IDLE.countdown;this.hideIdleAlert();if(activeAlerts>0){activeAlerts--;if(activeAlerts<=0){stopAlertSound();stopTntSound()}}}
  triggerIdleExplosion(){if(this.idleExploded)return;this.idleExploded=true;this.over=true;this.idle=true;this.pm=false;this.pwLock=performance.now()+500;if(activeAlerts>0){activeAlerts--;if(activeAlerts<=0)stopAlertSound();}
    const alert=$('bw'+this.p)?.querySelector('.idle-alert');alert?.classList.add('exploding');alert?.querySelector('.idle-number')?.remove();alert?.querySelector('.idle-text')?.remove();if(this.idleVideoFallback)this.startIdleExplosionFallback();
    this.boomT=0;this.flash=1;this.parts=[];for(let k=0;k<140;k++){const ang=Math.random()*Math.PI*2;const sp=2+Math.random()*10;this.parts.push({x:(COLS*BS)/2,y:(ROWS*BS)/2,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,l:1.8,c:COL[1+Math.random()*7|0][0]})}
    shake(this.p);playExplosionSound();sfx(70,.9,'sawtooth',.18,.35);pop(this.p,'💥', '#ff9b3d');
    this.b=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    if(this.opp)pop(this.opp.p,'⚠ INATIVO!','#ff7b7b');
  }
  pui(){const e=$('pw'+this.p);if(!e)return;e.classList.toggle('on',this.pm);
    [...e.querySelectorAll('.sl')].forEach((s,i)=>{s.classList.toggle('used',this.pu[i]);s.classList.toggle('sel',this.pm&&i===this.ps)})}
  setPM(v){if(v){if(this.pu.every(Boolean)){sfx(150,.1,'square',.06);return}
      if(this.pu[this.ps])this.ps=this.pu.findIndex(u=>!u)}
    this.pm=v;sfx(v?700:400,.08,'triangle',.07);this.pui()}
  pin(cmd,rep){ // entrada enquanto o painel de poderes está aberto
    if(cmd==='LEFT'||cmd==='RIGHT'){if(rep)return;
      for(let k=1;k<=3;k++){const i=(this.ps+(cmd==='LEFT'?-k:k)+9)%3;if(!this.pu[i]){this.ps=i;break}}
      sfx(520,.05,'triangle',.06);this.pui()}
    else if(cmd==='DOWN'){if(rep)return;this.usePower(this.ps)}
    else if(cmd==='UP'||cmd==='BTN_A')this.setPM(false)}
  usePower(i){const o=this.opp,id=POWERS[i].id;
    if(this.idle || this.pu[i] || !this.cur || this.anim || this.fx || this.over || !tl || count!==2){sfx(150,.1,'square',.06);pop(this.p,'AGORA NÃO!','#ff7b7b');return}
    const needs=id==='swap'?(o&&!o.over&&o.cur&&!o.anim&&!o.fx):id==='time'?(o&&!o.over):true;
    if(!needs){sfx(150,.1,'square',.06);pop(this.p,'AGORA NÃO!','#ff7b7b');return}
    this.pu[i]=true;this.pm=false;this.pwLock=performance.now()+500;
    pop(this.p,POWERS[i].e+' '+POWERS[i].n+'!');
    if(id==='bomb')this.bomb();else if(id==='swap')this.swapWith(o);else this.timeBonus();
    this.pui()}
  bomb(){let ty=ROWS/2;const r=this.b.findIndex(r=>r.some(Boolean));if(r>=0)ty=r;
    this.fx={t:0,boom:false,ty};sfx(300,.45,'sawtooth',.06,.3)}
  fxStep(dt){const f=this.fx;f.t+=dt;if(!f.boom&&f.t>=450){f.boom=true;this.explode()}if(f.t>=950){this.fx=null;this.t=0}}
  explode(){const f=this.fx,W=COLS*BS;
    for(let k=0;k<80;k++)this.parts.push({x:W/2+(Math.random()-.5)*W*.8,y:f.ty*BS+Math.random()*BS*4,vx:(Math.random()-.5)*14,vy:-Math.random()*10-2,l:1.3,c:COL[1+Math.random()*7|0][0]});
    this.b=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    [0,1,COLS-2,COLS-1].forEach(x=>{const h=1+Math.random()*3|0;for(let k=0;k<h;k++)if(Math.random()>.15)this.b[ROWS-1-k][x]=1+Math.random()*7|0});
    this.pend=0;this.flash=1;shake(this.p);sfx(70,.6,'sawtooth',.15,.3);playExplosionSound();pop(this.p,'💥 BOOM!','#ff9b3d');
    const c=this.cur;if(c){c.x=COLS-c.m[0].length>>1;c.y=0}}
  swapWith(o){[this.b,o.b]=[o.b,this.b];
    for(const g of[this,o]){const c=g.cur;if(c){c.x=COLS-c.m[0].length>>1;c.y=0;g.t=0;g.flash=1;shake(g.p);if(g.hit(c.m,c.x,c.y))g.over=true}}
    sfx(400,.4,'sawtooth',.07,2);pop(o.p,'🔄 TROCA!','#7dff8a')}
  timeBonus(){const extra=60;tl=Math.max(0,tl+extra);if($('timer')){$('timer').classList.remove('u');$('timer').classList.add('timer-pop','green');setTimeout(()=>{$('timer').classList.remove('timer-pop','green');if(tl>20){$('timer').classList.remove('u');tsnd.pause();tsnd.currentTime=0;}},1000)}
    pop(this.p,'⏱ +1:00');if(this.opp)pop(this.opp.p,'⏱ +1:00');sfx(930,.2,'square',.09,1.8)}

  update(dt){if(this.flash>0)this.flash=Math.max(0,this.flash-dt/350);
    if(this.boomT!=null){this.boomT+=dt;if(this.boomT>1500){this.boomT=null;this.flash=0;} return}
    if(this.over||this.paused)return;
    if(this.fx){this.fxStep(dt);return}
    if(this.anim){this.anim.t+=dt;if(this.anim.t>320)this.done();return}
    if(this.sd>0)this.sd-=dt;
    if(count===2 && !this.paused && !this.over && !this.anim && !this.fx && !ended){
      const idleMs=performance.now()-this.lastAct;
      if(idleMs>=Math.max(0,IDLE.warnAfter-IDLE.videoLead)){
        if(!this.idle){this.idle=true;this.idleLeadIn=IDLE.videoLead;this.idleCountdown=IDLE.countdown;this.showIdleAlert();activeAlerts++;playAlertSound();scheduleTntSound();}
        let countdownDt=dt;
        if(this.idleLeadIn>0){countdownDt=Math.max(0,dt-this.idleLeadIn);this.idleLeadIn=Math.max(0,this.idleLeadIn-dt)}
        const box=$('bw'+this.p)?.querySelector('.idle-alert'),number=box?.querySelector('.idle-number');
        if(this.idleLeadIn===0&&number){number.hidden=false;this.idleCountdown=Math.max(0,this.idleCountdown-countdownDt);number.textContent=Math.max(1,Math.ceil(this.idleCountdown/1000))}
        if(this.idleCountdown<=0){this.triggerIdleExplosion();}
      }else if(this.idle){this.cancelIdle();}
    }
    this.t+=dt;if(this.t>this.speed()){this.t=0;if(!this.mv(0,1))this.settle()}}
  drawNext(){const p=this.pc,m=this.nxt.m,bs=20;p.clearRect(0,0,88,88);p.save();p.translate((88-m[0].length*bs)/2,(88-m.length*bs)/2);m.forEach((r,j)=>r.forEach((v,i)=>v&&blk(p,i,j,v,bs)));p.restore()}
  draw(){const c=this.c,W=COLS*BS,H=ROWS*BS;c.clearRect(0,0,W,H);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){c.fillStyle=(x+y)%2?'rgba(255,255,255,.05)':'rgba(255,255,255,.1)';c.fillRect(x*BS,y*BS,BS,BS)}
    this.b.forEach((r,y)=>{const fl=this.anim&&this.anim.f.includes(y);r.forEach((v,x)=>{if(!v)return;if(fl){c.fillStyle=(this.anim.t/60|0)%2?'#fff':COL[v][0];c.fillRect(x*BS,y*BS,BS,BS)}else blk(c,x,y,v,BS)})});
    const k=this.cur;
    if(k&&!this.over){let gy=k.y;while(!this.hit(k.m,k.x,gy+1))gy++;
      k.m.forEach((r,j)=>r.forEach((v,i)=>{if(!v)return;c.globalAlpha=.5;c.strokeStyle=COL[v][1];c.setLineDash([5,4]);c.lineWidth=3;c.beginPath();c.roundRect((k.x+i)*BS+3,(gy+j)*BS+3,BS-6,BS-6,8);c.stroke();c.setLineDash([]);c.globalAlpha=1}));
      k.m.forEach((r,j)=>r.forEach((v,i)=>v&&blk(c,k.x+i,k.y+j,v,BS)))}
    const f=this.fx;
    if(f){if(!f.boom){const p=Math.min(1,f.t/450),y=-40+(f.ty*BS+40)*p*p;
        c.save();c.translate(W/2,y);c.rotate(135*Math.PI/180);c.font='46px serif';c.textAlign='center';c.textBaseline='middle';c.fillText('🚀',0,0);c.restore();
        c.strokeStyle='rgba(255,120,40,.55)';c.lineWidth=6;c.beginPath();c.moveTo(W/2,Math.max(0,y-90));c.lineTo(W/2,y-20);c.stroke()}
      else{const r=Math.min(1,(f.t-450)/500);c.strokeStyle=`rgba(255,160,50,${1-r})`;c.lineWidth=14*(1-r)+2;c.beginPath();c.arc(W/2,f.ty*BS,r*W*.8,0,7);c.stroke();
        c.fillStyle=`rgba(255,220,120,${.5*(1-r)})`;c.beginPath();c.arc(W/2,f.ty*BS,r*W*.5,0,7);c.fill()}}
    this.parts=this.parts.filter(q=>(q.l-=.02)>0);
    this.parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.4;c.globalAlpha=Math.min(1,q.l);c.fillStyle=q.c;c.fillRect(q.x,q.y,9,9);c.strokeStyle=INK;c.lineWidth=2;c.strokeRect(q.x,q.y,9,9)});c.globalAlpha=1;
    if(this.pend){c.fillStyle='#ff5252';c.fillRect(0,(ROWS-this.pend)*BS,7,this.pend*BS)}
    if(this.boomT!=null){const r=Math.min(1,this.boomT/1000),a=1-r; c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect(0,0,W,H); for(let k=0;k<18;k++){const ang=(Math.PI*2*k/18)+(this.boomT/200);const rad=30+(k*8)+r*130;c.strokeStyle=`rgba(255,255,255,${1-r})`;c.lineWidth=3;c.beginPath();c.arc(W/2,H/2,rad,ang,ang+Math.PI/3);c.stroke();} c.fillStyle='rgba(255,255,255,.85)'; c.font='bold 64px Fredoka'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('💥',W/2,H/2);}
    if(this.flash>0){c.fillStyle=`rgba(255,255,255,${this.flash*.8})`;c.fillRect(0,0,W,H)}
  }
}
function shake(p){const t=document.querySelector('#pl'+p+' .tilt');t.classList.remove('sk');void t.offsetWidth;t.classList.add('sk')}
function pop(p,t,c='#ffe66d'){const e=document.createElement('div');e.className='pop';e.textContent=t;e.style.color=c;$('bw'+p).append(e);setTimeout(()=>e.remove(),1000)}

$('hold1').onclick=()=>games[0]?.holdPiece();

/* ───── estado e navegação (estilo controle de console) ───── */
let games=[],count=1,mode='menu',tl=120,ended=false,last=0;const lastDown=[0,0,0];
const CARDS=[
 {t:'1 JOGADOR',s:'Treine sozinho e bata seu recorde',i:'<img src="./single_player.png" alt="1 jogador" onerror="this.replaceWith(\'🧱\')" style="width:72px;height:72px;object-fit:contain;display:block;">',c:'#4da6ff',f:()=>start(1)},
 {t:'2 JOGADORES',s:'Duelo! Combos mandam lixo e poderes mudam o jogo',i:'<img src="./multiplayer.png" alt="2 jogadores" onerror="this.replaceWith(\'⚔️\')" style="width:72px;height:72px;object-fit:contain;display:block;">',c:'#ff5fa2',f:()=>start(2)},
 {t:'CONTROLES',s:'Veja como usar o controle',i:'<img src="./control.png" alt="Controles" onerror="this.replaceWith(\'🎮\')" style="width:72px;height:72px;object-fit:contain;display:block;">',c:'#ffb400',f:showCtrl},
 {t:'MÚSICA',s:'',i:'<img src="./music_icon.png" alt="Música" onerror="this.replaceWith(\'🎵\')" style="width:72px;height:72px;object-fit:contain;display:block;">',c:'#2fcf6a',f:toggleMusic}];
const menu={idx:0,items:CARDS,back:null},dg={idx:0,items:[],back:null},S=()=>mode==='menu'?menu:dg;
CARDS.forEach((c,i)=>{const e=document.createElement('div');e.className='card';e.style.setProperty('--cc',c.c);
  e.innerHTML=`<div class="ic">${c.i}</div><h2>${c.t}</h2><p ${i==3?'id="mus"':''}>${c.s}</p>`;
  e.onclick=()=>{if(mode!=='menu')return;if(menu.idx===i)press();else{menu.idx=i;sfx(500,.07,'triangle',.07);mark()}};$('cards').append(e)});

function mark(){const n=CARDS.length;
  [...$('cards').children].forEach((e,i)=>{const o=((i-menu.idx+n*1.5)%n)-n/2;
    e.style.transform=`translateX(${o*92}%) translateZ(${-Math.abs(o)*170}px) rotateY(${-o*32}deg) scale(${o?.88:1.1})`;
    e.style.zIndex=9-Math.abs(o)*3;e.style.opacity=Math.abs(o)>1?.25:1;e.classList.toggle('sel',!o&&mode==='menu')});
  [...$('dbtns').children].forEach((e,i)=>e.classList.toggle('sel',i===dg.idx));
  $('mus').textContent=music?'Ligada ✓':'Desligada ✗'}

function dlg(title,html,btns,back){mode='dlg';Object.assign(dg,{idx:0,items:btns,back});$('dt').innerHTML=title;$('db').innerHTML=html;$('dbtns').innerHTML='';
  btns.forEach((b,i)=>{const e=document.createElement('button');e.className='btn '+b.c;e.textContent=b.t;e.onclick=()=>{dg.idx=i;press()};$('dbtns').append(e)});
  $('dlg').classList.add('on');mark()}
const closeDlg=()=>$('dlg').classList.remove('on');

function press(){const s=S(),it=s.items[s.idx],el=(mode==='menu'?$('cards'):$('dbtns')).children[s.idx];
  sfx(880,.15,'square',.07,1.6);el.classList.add('press');setTimeout(()=>{el.classList.remove('press');it.f()},170)}

function nav(cmd,rep){const s=S(),n=s.items.length;
  if(cmd==='LEFT'||cmd==='RIGHT'){if(rep)return;s.idx=(s.idx+(cmd==='LEFT'?n-1:1))%n;sfx(500+s.idx*60,.07,'triangle',.07);mark()}
  else if(cmd==='DOWN'||cmd==='BTN_A'){if(!rep)press()}            // ▼ = clique / confirmar
  else if(s.back&&(cmd==='UP'||cmd==='BTN_B'||cmd==='SELECT')){sfx(300,.1,'sine',.08);s.back()}} // ▲ = voltar

function input(p,cmd,rep){
  if(mode==='game'){
    const g=games[count===1?0:p-1];
    if(cmd==='SELECT')return pause();
    if(!g||g.over)return;
    if(count===1&&cmd==='POWER'){g.lastAct=performance.now();g.activateSoloPower();return}
    if(count===1&&cmd==='BTN_A'){g.lastAct=performance.now();g.holdPiece();return}
    if(count===2){
      if(g.pm){g.pin(cmd,rep);g.lastAct=performance.now();return}
      if(cmd==='BTN_A'){g.setPM(true);g.lastAct=performance.now();return}
    }
    if(cmd==='DOWN'&&rep&&performance.now()<g.lockT)return;
    if(cmd==='DOWN'&&performance.now()<g.pwLock)return;
    g.lastAct=performance.now();
    ({LEFT:()=>g.mv(-1,0),RIGHT:()=>g.mv(1,0),DOWN:()=>g.soft(rep),UP:()=>g.rot(),BTN_B:()=>g.hard()})[cmd]?.();return}
  if(mode==='menu'||mode==='dlg')nav(cmd,rep)}

/* ───── fluxo ───── */
function start(n){count=n;ended=false;tl=120;closeDlg();tsnd.pause();games.forEach(g=>g.hideIdleAlert());activeAlerts=0;stopAlertSound(true);stopTntSound();document.querySelectorAll('.idle-alert').forEach(e=>e.remove());
  $('menu').classList.add('hide');$('game').classList.remove('hide');
  $('pl2').classList.toggle('hide',n<2);$('vs').classList.toggle('hide',n<2);$('timer').classList.toggle('hide',n<2);$('arena').classList.toggle('one',n<2);
  games=[1,2].slice(0,n).map(p=>new Game(p));if(n===2){games[0].opp=games[1];games[1].opp=games[0]}
  $('timer').classList.remove('u','timer-pop','green');$('timer').textContent='2:00';mode='game';playMusicForCurrentMode();sfx(440,.3,'triangle',.08,2)}
function toMenu(){closeDlg();tsnd.pause();tsnd.currentTime=0;games.forEach(g=>g.hideIdleAlert());activeAlerts=0;stopAlertSound(true);stopTntSound();document.querySelectorAll('.idle-alert').forEach(e=>e.remove());games=[];$('game').classList.add('hide');$('menu').classList.remove('hide');mode='menu';menu.idx=0;playMusicForCurrentMode();mark()}
function resume(){closeDlg();games.forEach(g=>{g.paused=false;g.lastAct=performance.now();g.resumeIdleVideo()});if(activeAlerts>0)scheduleTntSound();mode='game';playMusicForCurrentMode()}
function pause(){games.forEach(g=>{g.paused=true;g.pauseIdleVideo()});tsnd.pause();stopTntSound(false);dlg('PAUSADO','Respira e volta com tudo! 🧘',[{t:'CONTINUAR',c:'green',f:resume},{t:'SAIR',c:'red',f:toMenu}],resume)}
function showCtrl(){const close=()=>{closeDlg();mode='menu';mark()};
  dlg('CONTROLES',`<div class="cg"><span><b class="k">◀</b><b class="k">▶</b></span><i style="font-style:normal">Mover a peça · escolher no menu</i>
  <span><b class="k">▲</b></span><i style="font-style:normal">Girar a peça · voltar</i>
  <span><b class="k">▼</b></span><i style="font-style:normal">Descer (segure = mais rápido) · CLICAR</i>
  <span><b class="k">B</b></span><i style="font-style:normal">Queda instantânea ⚡</i>
  <span><b class="k">A</b></span><i style="font-style:normal">Guardar peça (1P) · abrir poderes (2P)</i>
  <span><b class="k">STR</b></span><i style="font-style:normal">Usar bomba carregada (1P)</i>
  <span><b class="k">C / X</b></span><i style="font-style:normal">Teclado: guardar peça / usar bomba</i>
  <span><b class="k">◀▶ ▼</b></span><i style="font-style:normal">Nos poderes: ◀▶ escolhe, ▼ usa, ▲/A fecha</i>
  <span><b class="k">SEL</b></span><i style="font-style:normal">Pausar ⏸</i></div>`,[{t:'ENTENDI!',c:'green',f:close}],close)}
function end(o){ended=true;mode='wait';tsnd.pause();tsnd.currentTime=0;games.forEach(g=>g.hideIdleAlert());activeAlerts=0;stopAlertSound(true);stopTntSound();document.querySelectorAll('.idle-alert').forEach(e=>e.remove());const s=games.map(g=>g.score);let h;
  if(count===1)h=`<h3>${s[0]} pontos</h3>`+(s[0]>games[0].hi0?'<p>🏆 NOVO RECORDE!</p>':'');
  else{const idleOver=games.filter(g=>g.over&&g.idle);const winner = idleOver.length>1 ? 0 : o&&o.idle ? (o===games[0]?1:2) : o?(o===games[0]?2:1):s[0]>s[1]?1:s[1]>s[0]?2:0; const text = idleOver.length>1 ? '🤝 EMPATE!' : o&&o.idle ? `🏆 JOGADOR ${winner} VENCEU POR INATIVIDADE!` : winner ? `🏆 JOGADOR ${winner} VENCEU!` : '🤝 EMPATE!'; h=`<h3>${s[0]} × ${s[1]}</h3><p>${text}</p>`+(o&&o.idle?'':'<p>⏱ Tempo esgotado</p>')}
  const resultDelay=games.some(g=>g.idleExploded)?250:1800;
  setTimeout(()=>dlg(count===1?'FIM DE JOGO':'FIM DE PARTIDA',h,[{t:'JOGAR DE NOVO',c:'green',f:()=>start(count)},{t:'MENU',c:'blue',f:toMenu}],null),resultDelay)}

function loop(t){const dt=Math.min(50,t-last);last=t;
  if(games.length){
    if(count===2&&mode==='game'&&!ended){tl=Math.max(0,tl-dt/1000);const s=Math.max(0,Math.ceil(tl));$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
      $('timer').classList.toggle('u',tl<=20);if(tl<=20&&tsnd.paused)tsnd.play().catch(()=>{});if(tl>20){tsnd.pause();tsnd.currentTime=0;}}
    games.forEach(g=>{g.update(dt);g.draw()});
    if(!ended&&mode==='game'){const o=games.find(g=>g.over);const waitingForExplosion=games.some(g=>g.idleExploded&&!g.idleVideoDone);if((o||count===2&&tl<=0)&&!waitingForExplosion)end(o)}}
  requestAnimationFrame(loop)}

/* ───── Arduino (Web Serial) — o jogador é detectado pelo prefixo P1:/P2: ───── */
function setPill(p,on){const e=$('pp'+p);e.classList.toggle('ok',on);e.textContent=`P${p} · ${on?'conectado ✓':'sem controle'}`}
function fromSerial(p,cmd){const rep=cmd.endsWith('_HOLD');input(p,rep?cmd.slice(0,-5):cmd,rep)}
async function openPort(port){let who=0;
  try{await port.open({baudRate:9600});const rd=port.readable.pipeThrough(new TextDecoderStream()).getReader();let buf='';
    for(;;){const{value,done}=await rd.read();if(done)break;buf+=value;const ls_=buf.split('\n');buf=ls_.pop();
      for(const l of ls_){const m=l.trim().match(/P([12])(?::(\w+))?/);if(!m)continue;
        if(who!==+m[1]){who=+m[1];setPill(who,true);sfx(700,.15,'triangle',.08,1.5)}
        if(m[2])fromSerial(who,m[2])}}
  }catch(e){}
  if(who)setPill(who,false)}
$('cn').onclick=async()=>{startAudio();
  if(!('serial' in navigator))return alert('Web Serial API não suportada!\nUse Chrome ou Edge.');
  try{openPort(await navigator.serial.requestPort())}catch(e){if(e.name!=='NotFoundError')alert('Erro ao conectar: '+e.message)}};
navigator.serial?.getPorts().then(ps=>ps.forEach(openPort)).catch(()=>{});

addEventListener('keydown',e=>{if(mode!=='game'||count!==1)return;
  const keys={ArrowLeft:'LEFT',ArrowRight:'RIGHT',ArrowDown:'DOWN',ArrowUp:'UP',' ':'BTN_B',c:'BTN_A',x:'POWER',p:'SELECT'};
  const cmd=keys[e.key]||keys[e.key.toLowerCase()];if(!cmd)return;
  e.preventDefault();input(1,cmd,e.repeat)});
addEventListener('pointerdown',startAudio);
addEventListener('beforeunload',()=>navigator.serial?.getPorts().then(ps=>ps.forEach(p=>p.close().catch(()=>{}))));

mark();requestAnimationFrame(loop);
</script>
